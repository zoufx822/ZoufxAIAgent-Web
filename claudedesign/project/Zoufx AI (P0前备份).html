/* ── Presence 组件（v0.15：无 banner，大眼睛悬浮，mood 变化用双环脉冲）── */
function PresenceFloat({mood, context, hbState, forceAsleep=false, idleMs=0, lookDown=false, waking=false, spotlightKey=0, flyFrom=null}){
  const status = forceAsleep ? ASLEEP : resolveStatus(hbState, idleMs);
  const {glowEls, beatKey} = useMoodPresence(mood, spotlightKey);
  // 思考中 = 系统处于思考 / 调用工具状态（与 LLM 情绪正交）。
  const thinkingState = status.mood==='thinking' || status.mood==='tooling';
  // 情绪最小播放锁：情绪事件（spotlightKey 上升沿）一到立即播放并锁定；
  // 锁内情绪优先于思考中。锁过期后若系统仍在思考态，则让位给思考中；否则维持情绪。
  const [moodLocked,setMoodLocked]=useState(false);
  const lockRef=useRef(null);
  const prevSpotRef=useRef(spotlightKey);
  useEffect(()=>{
    if(spotlightKey>0 && spotlightKey!==prevSpotRef.current){
      setMoodLocked(true);
      clearTimeout(lockRef.current);
      lockRef.current=setTimeout(()=>setMoodLocked(false), MOOD_MIN_MS);
    }
    prevSpotRef.current=spotlightKey;
    return ()=>clearTimeout(lockRef.current);
  },[spotlightKey]);
  const showThinking = thinkingState && !moodLocked;
  const moodVisible = STATUS_HAS_MOOD[status.mood] && mood && !showThinking;

  // P1 · 进入 error 系统态时触发一次摇头（errorKey 上升沿驱动 Eyes）
  const [errKey,setErrKey]=useState(0);
  const prevErrStateRef=useRef(false);
  useEffect(()=>{
    const isErr = status.mood==='error';
    if(isErr && !prevErrStateRef.current) setErrKey(k=>k+1);
    prevErrStateRef.current=isErr;
  },[status.mood]);

  // FLIP：挂载时若带 flyFrom（来自起始页眼睛），把眼睛 wrap 从旧位置 80px 补间到此处 60px
  const eyesWrapRef=useRef(null);
  useLayoutEffect(()=>{
    if(flyFrom && eyesWrapRef.current) runFlip(eyesWrapRef.current, flyFrom, {scale:true});
  // eslint-disable-next-line
  },[]);

  return(
    <div className="presence-float" data-mood={status.mood} data-emotion={mood||''}>
      <div className="presence-eyes-wrap" ref={eyesWrapRef}>
        <div className={`mood-ambient${moodVisible?' on':''}`}/>
        <Eyes size={60} mood={mood} context={context} thinking={showThinking} beatKey={beatKey} errorKey={errKey}
              asleep={status.mood==='asleep'}
              drifting={status.mood==='drifting'}
              lookDown={lookDown} waking={waking}
              color="var(--accent)" pupil="var(--bg)"/>
        {showThinking && <span className="think-dots"><i/><i/><i/></span>}
        {glowEls}
      </div>
      <div className="presence-label">
        <span className="presence-dot"/>
        <span className="presence-status">
          <span className="status-zh">{status.zh}</span>
          <span className="status-en">{status.en}</span>
        </span>
        {moodVisible && <>
          <span className="presence-sep">·</span>
          <span key={mood} className="presence-mood">{mood}</span>
        </>}
      </div>
    </div>
  );
}

/* Chat */
function Chat({msgs,onSend,mood,context,hbState,forceAsleep=false,idleMs=0,lookDown=false,waking=false,onTypingStart,spotlightKey=0,focusSignal=0,flyEyesFrom=null,flyInputFrom=null}){
  const listRef=useRef(null);
  const inputSlotRef=useRef(null);
  const flying = !!(flyEyesFrom || flyInputFrom);

  useEffect(()=>{
    if(!listRef.current) return;
    const el=listRef.current;
    el.scrollTo({top:el.scrollHeight, behavior:'smooth'});
  },[msgs]);

  // FLIP：输入框从起始页居中大框位置滑到底部（仅平移，不缩放以保圆角）
  useLayoutEffect(()=>{
    if(flyInputFrom && inputSlotRef.current) runFlip(inputSlotRef.current, flyInputFrom, {scale:false});
  // eslint-disable-next-line
  },[]);

  return(
    <div className={flying?'chat-flying':'page-enter'} style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,minHeight:0}}>
      <PresenceFloat mood={mood} context={context} hbState={hbState} forceAsleep={forceAsleep} idleMs={idleMs} lookDown={lookDown} waking={waking} spotlightKey={spotlightKey} flyFrom={flyEyesFrom}/>
      <div ref={listRef} className="chat-scroll-area" style={{flex:1,minHeight:0,overflow:'auto',padding:'8px 56px 36px'}}>
        <div style={{maxWidth:720,margin:'0 auto'}}>
          {(()=>{
            // P6: 呼吸分段 + 消息间距
            const items = [];
            let roundIdx = 0; // 每个 user message 开启新一轮
            msgs.forEach((m,i)=>{
              const prev = msgs[i-1];
              if(m.role==='user') roundIdx++;
              // 每 3 轮前插入呼吸线（从第 4 轮起）
              if(m.role==='user' && roundIdx>1 && (roundIdx-1)%3===0){
                items.push(
                  <div key={`br-${m.id}`} className="breath-divider">
                    <svg width="40" height="1"><line x1="0" y1="0.5" x2="40" y2="0.5" stroke="var(--border)" strokeWidth="1" strokeDasharray="2 4"/></svg>
                  </div>
                );
              }
              const sameAuthor = prev && prev.role===m.role;
              const sameMin = prev && Math.floor(prev.id/60000)===Math.floor(m.id/60000);
              const crossAuthor = prev && prev.role!==m.role;
              // 间距规则：同分钟同作者 8px，跨作者 28px，其余 18px
              const mt = !prev ? 0 : crossAuthor ? 28 : sameMin ? 8 : 18;
              items.push(<div key={m.id} className="chat-msg-wrap" style={{marginTop:mt}}><Msg m={m} i={i}/></div>);
            });
            return items;
          })()}
        </div>
      </div>
      <div className="chat-input-area" style={{padding:'0 56px 24px',flexShrink:0}}>
        <div ref={inputSlotRef} style={{maxWidth:720,margin:'0 auto'}}>
          <InputBox placeholder="继续提问…" onSend={onSend} onTyping={onTypingStart} focusSignal={focusSignal}/>
        </div>
      </div>
    </div>
  );
}

/* App */
function App(){
  // ── Responsive sidebar ──
  const [autoMode,setAutoMode]=useState('full'); // 'full' | 'compact' | 'hidden'
  const [manualOverride,setManualOverride]=useState(null); // null = follow auto
  const rootRef=useRef(null);

  useEffect(()=>{
    const el=document.getElementById('root');
    const obs=new ResizeObserver(entries=>{
      const w=entries[0].contentRect.width;
      if(w<560) setAutoMode('hidden');
      else if(w<860) setAutoMode('compact');
      else setAutoMode('full');
    });
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);

  // When auto changes, clear manual override if it matches auto
  useEffect(()=>{ setManualOverride(null); },[autoMode]);

  const sidebarMode = manualOverride ?? autoMode; // 'full' | 'compact' | 'hidden'
  const sidebarCompact = sidebarMode==='compact';
  const sidebarHidden  = sidebarMode==='hidden';
  const [mobileOpen,setMobileOpen]=useState(false);

  const [tweak,setTweak]=useState(()=>{
    try{ const s=localStorage.getItem('zoufx'); return s?{...TWEAK_DEFAULTS,...JSON.parse(s)}:TWEAK_DEFAULTS; }
    catch{ return TWEAK_DEFAULTS; }
  });
  const [showTp,setShowTp]=useState(false);
  const [chats,setChats]=useState(MOCK);
  const [activeId,setActiveId]=useState(1);
  const [chatMsgs,setChatMsgs]=useState({});
  const [isHome,setIsHome]=useState(true);
  const [pageKey,setPageKey]=useState(0);
  const [userName,setUserName]=useState(()=>{
    try{
      const v=localStorage.getItem('zUserName');
      // Reset legacy values that were captured from first message (too long / contains punctuation)
      if(!v || v.length>4) { localStorage.setItem('zUserName','星'); return '星'; }
      return v;
    }catch{return '星';}
  });
  useEffect(()=>{ window.__zUserName=userName; },[userName]);
  const [memoryOpen,setMemoryOpen]=useState(false);
  const [hbState,setHbState]=useState('等待输入');
  // 回复结束 → 自增，驱动输入框自动 refocus
  const [focusKey,setFocusKey]=useState(0);
  // FLIP 转场：起始页发送时采集眼睛/输入框旧位置，传给 Chat 做连续位移
  const [flyEyesFrom,setFlyEyesFrom]=useState(null);
  const [flyInputFrom,setFlyInputFrom]=useState(null);
  const [currentMood,setCurrentMood]=useState(null);
  // P2 spotlight：mood 变化 → 触发双圈扩散
  const [spotlightKey,setSpotlightKey]=useState(0);
  const [mockNight,setMockNight]=useState(false);
  const triggerSpotlight=()=>setSpotlightKey(k=>k+1);
  // 打字注视 + 唤醒
  const [typingActive,setTypingActive]=useState(false);
  const _wakeH=new Date().getHours();
  const isWaking = typingActive && (_wakeH>=23||_wakeH<5||mockNight);
  function handleTypingStart(active){ setTypingActive(active); }
  // Presence 布局 state 已弃用（v0.14 rev6 固定 B 顶部 sticky）
  // const [presenceLayout,setPresenceLayout]=useState('sticky');
  const [memories,setMemories]=useState([
    {tag:'偏好',text:'喜欢 Vercel / Linear 风格的冷淡 UI。'},
    {tag:'项目',text:'正在搭建 Zoufx AI 前端，采用 Next.js + Tailwind。'},
  ]);
  const [lastUserMsg,setLastUserMsg]=useState('');
  // hot memory 白名单 10 字段（demo 初值：stranger 档，仅 2 个外显字段）
  const [hotMemory,setHotMemory]=useState({
    display_name:'星',
    role:'程序员',
  });
  // significant-event / commitment — v0.14 新增（Map<uuid, description>，无时间序）
  const [events,setEvents]=useState({});
  const [commitments,setCommitments]=useState({});
  const [anchors,setAnchors]=useState(null); // v0.145 · 默认空（first conversation 文案）
  const [lookbackOpen,setLookbackOpen]=useState(false);

  // 用户活跃态 — 派生 Eyes context（normal / long-silence / high-intensity）
  const [lastInputAt,setLastInputAt]=useState(Date.now());
  const [recentMsgTimes,setRecentMsgTimes]=useState([]);
  const [nowTick,setNowTick]=useState(Date.now());
  useEffect(()=>{
    // 15 秒一次时钟刻度，用于刷新 context 派生
    const t=setInterval(()=>setNowTick(Date.now()),10000);
    return()=>clearInterval(t);
  },[]);
  // 监听全局交互（鼠标移动 / 键盘按键）刷新 lastInputAt
  useEffect(()=>{
    const refresh = ()=>setLastInputAt(Date.now());
    window.addEventListener('mousemove',refresh,{passive:true});
    window.addEventListener('keydown',refresh,{passive:true});
    window.addEventListener('click',refresh,{passive:true});
    return()=>{
      window.removeEventListener('mousemove',refresh);
      window.removeEventListener('keydown',refresh);
      window.removeEventListener('click',refresh);
    };
  },[]);
  // 派生 context
  const intimacy = intimacyMode(hotMemory);
  const eyesContextAuto = (()=>{
    const silentMs = nowTick - lastInputAt;
    const win = nowTick - 2*60*1000;
    const recentCount = recentMsgTimes.filter(t=>t>=win).length;
    if(recentCount >= 3) return 'high-intensity';
    if(silentMs > 90*1000) return 'long-silence';
    return 'normal';
  })();
  const [contextOverride,setContextOverride]=useState(null); // tweaks 强制覆盖
  const eyesContext = contextOverride || eyesContextAuto;
  // 派生默认 mood（若无显式 mood，按 intimacy 兜底）
  const effectiveMood = currentMood || INTIMACY_DEFAULT_MOOD[intimacy];

  const isLight=tweak.theme==='light';

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',tweak.theme);
  },[tweak.theme]);

  useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode') setShowTp(true);
      if(e.data?.type==='__deactivate_edit_mode') setShowTp(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);

  function applyTw(k,v){
    const n={...tweak,[k]:v};
    setTweak(n);
    localStorage.setItem('zoufx',JSON.stringify(n));
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:{[k]:v}},'*');
  }

  function toggleSidebar(){
    if(sidebarHidden){
      setMobileOpen(o=>!o);
    } else if(sidebarMode==='full'){
      setManualOverride('compact');
    } else {
      setManualOverride('full');
    }
  }

  function newChat(){
    const id=Date.now();
    setChats(p=>[{id,title:'新对话',t:'刚刚'},...p]);
    setActiveId(id);
    setIsHome(true);
    setPageKey(k=>k+1);
  }

  function selChat(id){
    const prev=activeId;
    setActiveId(id);
    const m=chatMsgs[id];
    const goHome=!m||!m.length;
    if(prev!==id || isHome!==goHome){ setPageKey(k=>k+1); }
    setIsHome(goHome);
  }

  function deleteChat(id){
    setChats(p=>p.filter(c=>c.id!==id));
    if(activeId===id){
      const remaining=chats.filter(c=>c.id!==id);
      if(remaining.length){ selChat(remaining[0].id); }
      else { newChat(); }
    }
  }

  function renameChat(id,title){
    setChats(p=>p.map(c=>c.id===id?{...c,title}:c));
  }

  function send(text){
    const id=activeId;
    setChats(p=>p.map(c=>c.id===id?{...c,title:text.length>20?text.slice(0,20)+'…':text}:c));
    const uid=Date.now(), rid=uid+1;
    const userMsg={id:uid,role:'user',content:text};

    // Identity capture removed — username is set explicitly (demo: "星")

    setChatMsgs(p=>({...p,[id]:[...(p[id]||[]),userMsg]}));
    setLastUserMsg(text);
    setLastInputAt(Date.now());
    setRecentMsgTimes(p=>[...p.slice(-9), Date.now()]);
    // FLIP 转场：仅起始页→聊天页的那一次，同步测量眼睛/输入框当前 rect（DOM 仍是 Home）
    let flyEyes=null, flyInput=null;
    if(isHome){
      const eEl=document.querySelector('.home-page .eyes-z');
      const iEl=document.querySelector('.home-input-slot');
      if(eEl){const r=eEl.getBoundingClientRect(); flyEyes={left:r.left,top:r.top,width:r.width,height:r.height};}
      if(iEl){const r=iEl.getBoundingClientRect(); flyInput={left:r.left,top:r.top,width:r.width,height:r.height};}
    }
    setFlyEyesFrom(flyEyes);
    setFlyInputFrom(flyInput);
    setIsHome(false);
    setPageKey(k=>k+1);

    // Mock structured streaming response
    const thinkStyle='C';
    const thinkText='用户提出了一个开放性问题。先判断意图：是要“推荐”还是“梳理”。\n判定为后者。需要调用记忆查询看看过去是否谈过相关话题，避免重复。';
    setHbState('正在思考…');
    // 思考中：思考 + 调用工具阶段脸显示"思考中"（系统状态驱动）。
    // LLM 情绪在开始吐回复正文那一刻才落定 → 届时立即切到对应情绪。
    // ⚠️ 仅原型演示用：真实产品里情绪完全由后端决定（MoodService 瞬时情绪 / 行内 <!--mood:xx-->
    // → SSE mood 事件），前端只是按 keyword 原样消费、不做任何挑选。这里没有后端，
    // 故用一张加权表模拟"正常聊天的情绪分布"让 demo 更真实：愉快/平静为默认层（愉快最常见、
    // 平静次之），其余更强烈的情绪只偶尔出现。接后端时整段删除，mood 直接取自 SSE。
    const MOOD_WEIGHTS = {'愉快':42,'平静':24,'好奇':12,'兴奋':9,'困惑':6,'难过':4,'愤怒':3};
    const picked = (()=>{
      const total = MOODS.reduce((s,m)=>s+(MOOD_WEIGHTS[m]||1),0);
      let r = Math.random()*total;
      for(const m of MOODS){ r -= (MOOD_WEIGHTS[m]||1); if(r<=0) return m; }
      return '愉快';
    })();
    const toolPart={type:'tool',tool:'search_cold_memory',toolDisplay:'记忆检索',status:'running',duration:'—',params:`{\n  scope: "long_term",\n  query: ${JSON.stringify(text.slice(0,30))},\n  limit: 5\n}`,result:null};
    const initialMsg={id:rid,role:'assistant',parts:[
      {type:thinkStyle==='A'?'thinking-a':'thinking-c',text:'',streaming:true,startIdx:0},
      toolPart,
    ]};
    setChatMsgs(p=>({...p,[id]:[...(p[id]||[]),initialMsg]}));

    // Stream thinking
    let ti=0;
    const tiv=setInterval(()=>{
      ti++;
      const slice=thinkText.slice(0,ti);
      setChatMsgs(p=>({...p,[id]:(p[id]||[]).map(m=>{
        if(m.id!==rid)return m;
        const parts=[...m.parts];
        parts[0]={...parts[0],text:slice,streaming:true,startIdx:Math.max(0,ti-12)};
        return{...m,parts};
      })}));
      if(ti>=thinkText.length){
        clearInterval(tiv);
        setHbState('调用工具…');
        // Finish thinking, run tool, then stream content（留出 ~0.9s 让 running 计时跳动可见）
        setTimeout(()=>{
          setChatMsgs(p=>({...p,[id]:(p[id]||[]).map(m=>{
            if(m.id!==rid)return m;
            const parts=[...m.parts];
            parts[0]={...parts[0],streaming:false};
            parts[1]={...parts[1],status:'done',duration:'0.92s',result:'找到 2 条相关记忆。\n  · 全部来自昨天凌晨。'};
            return{...m,parts:[...parts,{type:'content',text:'',streaming:true}]};
          })}));
          // 开始回复 → LLM 情绪落定，立即切到对应情绪（触发节拍 + 光晕 + 最小播放锁）
          setHbState('正在回复…');
          setCurrentMood(picked); triggerSpotlight();

          const reply=REPLIES[replyIdx%REPLIES.length]; replyIdx++;
          let i=0;
          // mood-based 流速：好奇快，难过慢，困惑有随机停顿
          const streamMood = picked;
          const STREAM_SPD = {'好奇':9,'兴奋':7,'愉快':11,'平静':14,'愤怒':11,'难过':22,'困惑':14};
          const baseDelay  = STREAM_SPD[streamMood] || 14;
          function streamNext(){
            i++;
            setChatMsgs(p=>({...p,[id]:(p[id]||[]).map(m=>{
              if(m.id!==rid)return m;
              const parts=[...m.parts];
              parts[parts.length-1]={...parts[parts.length-1],text:reply.slice(0,i)};
              return{...m,parts};
            })}));
            if(i>=reply.length){
              /* 流结束：标记 streaming:false，触发 StreamingContent parser_end + shiki */
              setChatMsgs(p=>({...p,[id]:(p[id]||[]).map(m=>{
                if(m.id!==rid)return m;
                const parts=[...m.parts];
                const last=parts.length-1;
                if(parts[last]?.type==='content') parts[last]={...parts[last],streaming:false};
                return{...m,parts};
              })}));
              setHbState('等待输入');
              setFocusKey(k=>k+1);
              return;
            }
            // 困惑：每~50字概率停顿
            let delay=baseDelay;
            if(streamMood==='困惑' && i%50===0 && Math.random()<0.7) delay+=180;
            setTimeout(streamNext, delay);
          }
          setTimeout(streamNext, baseDelay);
        },900);
      }
    },18);
  }

  const curMsgs=chatMsgs[activeId]||[];

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Rail
        memoryOpen={memoryOpen}
        onMemoryClick={()=>setMemoryOpen(o=>!o)}
        onNewChat={()=>{ newChat(); setMemoryOpen(false); }}
      />

      {/* Memory drawer */}
      {memoryOpen&&(<>
        <div className="drawer-bg" onClick={()=>setMemoryOpen(false)}/>
        <div className="drawer">
          <div style={{padding:'14px 16px 8px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:'.16em',textTransform:'uppercase',color:'var(--t3)'}}>记忆锚点</span>
            <button onClick={()=>{newChat();setMemoryOpen(false);}} style={{background:'transparent',border:'1px solid var(--border)',borderRadius:7,padding:'3px 10px',fontSize:11,color:'var(--t2)',cursor:'pointer',fontFamily:'inherit'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--t1)';e.currentTarget.style.color='var(--t1)';}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.color='var(--t2)';}}
            >+ 新</button>
          </div>
          <div style={{flex:1,overflow:'auto',padding:'0 10px 12px'}}>
            {chats.map(c=>(
              <ChatItem key={c.id} c={c} active={activeId===c.id}
                onSelect={()=>{selChat(c.id);setMemoryOpen(false);}}
                onDelete={()=>deleteChat(c.id)}
                onRename={t=>renameChat(c.id,t)}
              />
            ))}
          </div>
          <div style={{padding:'10px 16px',borderTop:'1px solid var(--border)',fontFamily:'var(--mono)',fontSize:10,color:'var(--t3)',letterSpacing:'.08em'}}>
            底层为连续记忆流，上方仅为分组。
          </div>
        </div>
      </>)}

      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,minHeight:0}}>
        {/* Page */}
        {isHome
          ? <Home key={`home-${pageKey}`} onSend={send} mood={effectiveMood} context={eyesContext} intimacy={intimacy} forceAsleep={mockNight} idleMs={nowTick-lastInputAt} lookDown={typingActive} waking={isWaking} onTypingStart={handleTypingStart} spotlightKey={spotlightKey}/>
          : <Chat key={`chat-${pageKey}`} msgs={curMsgs} onSend={send}
                  mood={effectiveMood} context={eyesContext}
                  hbState={hbState} forceAsleep={mockNight} idleMs={nowTick-lastInputAt} lookDown={typingActive} waking={isWaking} onTypingStart={handleTypingStart} spotlightKey={spotlightKey} focusSignal={focusKey}
                  flyEyesFrom={flyEyesFrom} flyInputFrom={flyInputFrom}/>
        }
      </div>

      <StatePanel
        hbState={hbState}
        lastUserMsg={lastUserMsg}
        currentMood={currentMood}
        memories={memories}
        hotMemory={hotMemory}
        events={events}
        commitments={commitments}
        anchors={anchors}
        onOpenLookback={()=>setLookbackOpen(true)}
      />

      {lookbackOpen && (
        <LookBackModal
          events={events}
          commitments={commitments}
          userName={userName}
          onClose={()=>setLookbackOpen(false)}
        />
      )}

      {showTp&&(
        <div className="tp">
          <div className="tp-title">Tweaks</div>
          <div className="tp-row">
            <span className="tp-label">主题</span>
            <select style={{background:'var(--chip)',border:'1px solid var(--border)',color:'var(--t1)',borderRadius:7,padding:'3px 8px',fontSize:12,fontFamily:'inherit',cursor:'pointer',outline:'none'}}
              value={tweak.theme} onChange={e=>applyTw('theme',e.target.value)}>
              <option value="light">亮色</option>
              <option value="dark">深色</option>
            </select>
          </div>

          <div style={{height:1,background:'var(--border-lt)',margin:'10px 0 14px'}}/>
          <div className="tp-title" style={{marginBottom:10}}>Mood · 情感</div>
          <div className="tp-row">
            <span className="tp-label">模拟深夜（asleep 眼）</span>
            <label className="tog"><input type="checkbox" checked={mockNight} onChange={e=>setMockNight(e.target.checked)}/><span className="tog-track"/></label>
          </div>
          <div className="tp-row" style={{marginTop:4}}>
            <span className="tp-label">模拟走神（idle 90s+）</span>
            <button onClick={(e)=>{ e.stopPropagation(); setLastInputAt(Date.now()-100000); }}
              style={{background:'transparent',border:'1px solid var(--border)',color:'var(--t2)',borderRadius:7,padding:'3px 10px',fontSize:11,fontFamily:'inherit',cursor:'pointer'}}>触发 →</button>
          </div>
          <div className="tp-row" style={{flexDirection:'column',alignItems:'stretch',gap:6}}>
            <span className="tp-label">当前 mood</span>
            <select
              value={hbState==='正在思考…'?'__think__':(currentMood||'')}
              onChange={e=>{
                const v=e.target.value;
                if(v==='__think__'){
                  setCurrentMood(null);
                  if(isHome){ setIsHome(false); setPageKey(k=>k+1); setTimeout(()=>setHbState('正在思考…'),350); }
                  else setHbState('正在思考…');
                  return;
                }
                if(hbState==='正在思考…') setHbState('等待输入');
                setCurrentMood(v||null);
                if(v) triggerSpotlight();
              }}
              style={{background:'var(--chip)',border:'1px solid var(--border)',color:'var(--t1)',borderRadius:7,padding:'4px 8px',fontSize:12,fontFamily:'inherit',cursor:'pointer',outline:'none'}}
            >
              <option value="">— 无 —</option>
              <option value="__think__">思考（系统态）</option>
              {MOODS.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          <div className="tp-row" style={{marginTop:10}}>
            <span className="tp-label">触发聚光灯</span>
            <button onClick={()=>{
              if(isHome){ setIsHome(false); setPageKey(k=>k+1); setTimeout(()=>{ if(!currentMood){ setCurrentMood('好奇'); } triggerSpotlight(); },350); }
              else { if(!currentMood){ setCurrentMood('好奇'); } triggerSpotlight(); }
            }} style={{background:'transparent',border:'1px solid var(--border)',color:'var(--t2)',borderRadius:7,padding:'3px 10px',fontSize:11,fontFamily:'inherit',cursor:'pointer'}}>
              触发 →
            </button>
          </div>
          <div className="tp-row" style={{marginTop:6}}>
            <span className="tp-label">连发 3 次情绪 · 250ms</span>
            <button onClick={()=>{
              const seq=['好奇','兴奋','困惑'];
              const run=()=>{ seq.forEach((m,k)=>setTimeout(()=>{ setCurrentMood(m); triggerSpotlight(); }, k*250)); };
              if(isHome){ setIsHome(false); setPageKey(p=>p+1); setTimeout(run,350); } else run();
            }} style={{background:'transparent',border:'1px solid var(--border)',color:'var(--t2)',borderRadius:7,padding:'3px 10px',fontSize:11,fontFamily:'inherit',cursor:'pointer'}}>
              连发 →
            </button>
          </div>
          <div className="tp-row" style={{marginTop:6}}>
            <span className="tp-label">模拟出错（error 摇头）</span>
            <button onClick={()=>{
              const fire=()=>{ setHbState('出错了'); setTimeout(()=>setHbState('等待输入'), 1600); };
              if(isHome){ setIsHome(false); setPageKey(k=>k+1); setTimeout(fire,350); } else fire();
            }} style={{background:'transparent',border:'1px solid var(--border)',color:'var(--t2)',borderRadius:7,padding:'3px 10px',fontSize:11,fontFamily:'inherit',cursor:'pointer'}}>
              出错 →
            </button>
          </div>

          <div style={{height:1,background:'var(--border-lt)',margin:'14px 0 14px'}}/>
          <div className="tp-title" style={{marginBottom:10}}>v0.14 · 关系 / 记忆</div>

          <div className="tp-row" style={{flexDirection:'column',alignItems:'stretch',gap:6}}>
            <span className="tp-label">Intimacy 档位 · 当前 {intimacy} ({filledCount(hotMemory)}/{HOT_TOTAL})</span>
            <div style={{display:'flex',gap:4}}>
              {[
                {k:'stranger',  l:'初识',  data:{display_name:'星'}},
                {k:'half-known',l:'半熟',  data:{display_name:'星',role:'程序员',language:'中文',interests:'AI/独立游戏',personality:'慢热，初识时话少',communication_style:'喜欢直接、多举例'}},
                {k:'fully-known',l:'熟人', data:{display_name:'星',role:'程序员',language:'中文',timezone:'UTC+8',interests:'AI/独立游戏',personality:'慢热，初识时话少',communication_style:'喜欢直接、多举例',habits:'习惯先列清单再开始',values:'真诚比客套重要',hobbies:'弹钢琴 / 爬山'}},
              ].map(o=>(
                <button key={o.k} onClick={()=>setHotMemory(o.data)} style={{
                  flex:1,background:intimacy===o.k?'var(--accent-s)':'transparent',
                  border:`1px solid ${intimacy===o.k?'var(--accent-r)':'var(--border)'}`,
                  color:intimacy===o.k?'var(--accent)':'var(--t2)',
                  borderRadius:7,padding:'4px 0',fontSize:11,fontFamily:'inherit',cursor:'pointer',
                }}>{o.l}</button>
              ))}
            </div>
          </div>

          <div className="tp-row" style={{flexDirection:'column',alignItems:'stretch',gap:6,marginTop:10}}>
            <span className="tp-label">用户活跃态 (Eyes 反应)</span>
            <div style={{display:'flex',gap:4}}>
              {[
                {k:null,             l:'自动'},
                {k:'normal',         l:'正常'},
                {k:'long-silence',   l:'静默'},
                {k:'high-intensity', l:'连击'},
              ].map(o=>{
                const active = contextOverride===o.k;
                return(
                <button key={String(o.k)} onClick={()=>setContextOverride(o.k)} style={{
                  flex:1,background:active?'var(--accent-s)':'transparent',
                  border:`1px solid ${active?'var(--accent-r)':'var(--border)'}`,
                  color:active?'var(--accent)':'var(--t2)',
                  borderRadius:7,padding:'4px 0',fontSize:10.5,fontFamily:'inherit',cursor:'pointer',
                }}>{o.l}</button>
              );})}
            </div>
            <span style={{fontSize:10.5,color:'var(--t3)',marginTop:2}}>当前生效：{eyesContext}{!contextOverride&&' · 自动'}</span>
          </div>

          <div className="tp-row" style={{marginTop:10}}>
            <span className="tp-label">记忆锚点 mock</span>
            <button onClick={()=>setAnchors(anchors?null:MOCK_ANCHORS)} style={{background:'transparent',border:'1px solid var(--border)',color:'var(--t2)',borderRadius:7,padding:'3px 10px',fontSize:11,fontFamily:'inherit',cursor:'pointer'}}>
              {anchors?'清空':'灌入分层摘要'}
            </button>
          </div>
          <div className="tp-row" style={{marginTop:6}}>
            <span className="tp-label">重要经历 mock</span>
            <button onClick={()=>setEvents(Object.keys(events).length?{}:MOCK_EVENTS)} style={{background:'transparent',border:'1px solid var(--border)',color:'var(--t2)',borderRadius:7,padding:'3px 10px',fontSize:11,fontFamily:'inherit',cursor:'pointer'}}>
              {Object.keys(events).length?'清空':'灌入 3 条'}
            </button>
          </div>
          <div className="tp-row" style={{marginTop:6}}>
            <span className="tp-label">承诺 mock</span>
            <button onClick={()=>setCommitments(Object.keys(commitments).length?{}:MOCK_COMMITMENTS)} style={{background:'transparent',border:'1px solid var(--border)',color:'var(--t2)',borderRadius:7,padding:'3px 10px',fontSize:11,fontFamily:'inherit',cursor:'pointer'}}>
              {Object.keys(commitments).length?'清空':'灌入 3 条'}
            </button>
          </div>
          <div className="tp-row" style={{marginTop:6}}>
            <span className="tp-label">打开回顾浮层</span>
            <button onClick={()=>setLookbackOpen(true)} style={{background:'transparent',border:'1px solid var(--border)',color:'var(--t2)',borderRadius:7,padding:'3px 10px',fontSize:11,fontFamily:'inherit',cursor:'pointer'}}>
              回顾 →
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
