<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoufx AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'calt' 0; }
@keyframes pulse-dot { 0%,100%{opacity:.3;} 50%{opacity:1;} }
@keyframes char-in { from { opacity:0; filter:blur(2px); } to { opacity:1; filter:blur(0); } }
.think-char { display:inline; animation: char-in .4s ease both; }
.tool-runbar { background-image: linear-gradient(90deg, transparent 0%, var(--t1) 50%, transparent 100%); background-size: 200% 100%; animation: tool-run 1.4s linear infinite; height:1px; }
@keyframes tool-run { 0%{background-position:100% 0;} 100%{background-position:-100% 0;} }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="module">
  import('https://cdn.jsdelivr.net/npm/streaming-markdown/+esm')
    .then(m=>{
      window.__smd=m;
      document.dispatchEvent(new Event('__smd_ready'));
    })
    .catch(()=>{});
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ── Monochrome accent ── */
:root {
  --accent:     oklch(0.14 0.04 260);
  --accent-s:   oklch(0.14 0.04 260 / 0.06);
  --accent-r:   oklch(0.14 0.04 260 / 0.14);
}

/* ── LIGHT (default) ── */
:root {
  --bg:         #ffffff;
  --sidebar:    #f9f9f9;
  --surface:    #ffffff;
  --surf-hov:   #f4f4f4;
  --border:     #e8e8e8;
  --border-lt:  #f0f0f0;
  --t1:         #0a0a0a;
  --t2:         #737373;
  --t3:         #c0c0c0;
  --chip:       #f4f4f4;
  --chip-brd:   #e4e4e4;
  --shadow:     0 1px 4px #00000008, 0 2px 12px #00000006;
  --shadow-lg:  0 4px 24px #00000010, 0 1px 4px #00000008;
  --scrollbar:  #e0e0e0;
}

/* ── DARK ── */
[data-theme="dark"] {
  --bg:         #0c0c0c;
  --sidebar:    #0f0f0f;
  --surface:    #161616;
  --surf-hov:   #1e1e1e;
  --border:     #282828;
  --border-lt:  #1f1f1f;
  --t1:         #ededed;
  --t2:         #737373;
  --t3:         #3d3d3d;
  --chip:       #1a1a1a;
  --chip-brd:   #2a2a2a;
  --shadow:     0 1px 4px #00000040, 0 2px 12px #00000030;
  --shadow-lg:  0 4px 24px #00000060, 0 1px 4px #00000040;
  --scrollbar:  #2a2a2a;
  --accent:     oklch(0.92 0.01 260);
  --accent-s:   oklch(0.92 0.01 260 / 0.08);
  --accent-r:   oklch(0.92 0.01 260 / 0.16);
}

body {
  font-family: 'Space Grotesk','Noto Sans SC',sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--bg);
  color: var(--t1);
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .35s ease, color .35s ease;
}

/* Global transitions for themed elements */
*, *::before, *::after {
  transition-property: background-color, border-color, color, box-shadow;
  transition-duration: .22s;
  transition-timing-function: ease;
}
textarea, input, button { transition: none; }
.no-trans, .no-trans * { transition: none !important; }

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:2px;}

@keyframes up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.65);}40%{opacity:1;transform:scale(1);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes thinkPulse{0%,100%{opacity:.35;}50%{opacity:1;}}
@keyframes toolPulse{0%,100%{transform:scale(1);opacity:.55;}50%{transform:scale(1.5);opacity:1;}}

/* Thinking A — mono + left line */
.think-a{position:relative;font-family:var(--mono);font-size:12.5px;line-height:1.85;color:var(--t2);padding:6px 0 6px 14px;margin:4px 0 14px;border-left:1px solid var(--border);letter-spacing:0;white-space:pre-wrap;}
.think-head{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.think-head-dot{width:5px;height:5px;border-radius:50%;background:var(--t2);animation:thinkPulse 1.6s ease-in-out infinite;}

/* Thinking C — char-fade italic */
.think-c{font-size:13.5px;line-height:1.9;color:var(--t2);margin:4px 0 14px;padding:6px 0 6px 14px;border-left:1px solid var(--border);white-space:pre-wrap;font-style:italic;letter-spacing:.005em;}
.think-c .c{opacity:0;animation:fadeIn .55s ease forwards;}

/* Tool call panel — 精密仪器 */
.tool{font-family:var(--mono);border:1px solid var(--border);background:var(--surface);border-radius:6px;margin:8px 0 18px;overflow:hidden;font-size:12px;}
.tool-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sidebar);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
.tool-head.closed{border-bottom:none;}
.tool-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--t1);}
.tool-dot.running{animation:toolPulse 1.2s ease-in-out infinite;}
.tool-dot.done{background:var(--t2);}
.tool-dot.error{background:#dc2626;}
.tool-name{font-weight:500;color:var(--t1);letter-spacing:.01em;font-size:11.5px;}
.tool-meta{margin-left:auto;color:var(--t3);font-size:10.5px;letter-spacing:.06em;display:flex;align-items:center;gap:8px;}
.tool-meta .sep{width:1px;height:9px;background:var(--border);}
.tool-caret{color:var(--t3);transition:transform .2s;display:flex;}
.tool-caret.open{transform:rotate(90deg);}
.tool-body{padding:10px 12px;font-size:11.5px;color:var(--t2);line-height:1.7;overflow:auto;}
.tool-body .lbl{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin:0 0 5px;}
.tool-body .lbl + .v{margin:0 0 10px;color:var(--t1);font-size:11.5px;white-space:pre-wrap;}
.tool-body .lbl:not(:first-child){margin-top:4px;}

/* P3 · 工具块呈现节奏 ─────────────────────────────────────────────
   ① 出现时 max-height "长出" + 淡入（一次性，挂载即播）
   ② running 时计时跳动由 JS 驱动（数字本身），dot 已有脉冲
   ③ 完成 0.4s 后未展开 → 收扁（.flat）：head 变薄、整体压暗；hover 还原 */
.tool{animation:tool-grow .42s cubic-bezier(.22,1,.36,1);}
@keyframes tool-grow{
  0%  {opacity:0;max-height:0;transform:translateY(-3px);}
  100%{opacity:1;max-height:260px;transform:translateY(0);}
}
.tool-head{transition:padding .32s cubic-bezier(.22,1,.36,1),opacity .32s ease,background-color .22s ease,border-color .22s ease;}
.tool.flat{opacity:.78;}
.tool.flat .tool-head{padding-top:5px;padding-bottom:5px;}
.tool.flat .tool-meta{opacity:.5;}
.tool.flat:hover{opacity:1;}
.tool.flat:hover .tool-head{padding-top:8px;padding-bottom:8px;}
.tool.flat:hover .tool-meta{opacity:1;}
.tool.flat:hover .tool-body{opacity:1 !important;pointer-events:auto !important;transition:opacity .18s ease !important;}
.tool-meta{transition:opacity .28s ease;}
/* running 计时数字：等宽避免抖动时整体宽度跳动 */
.tool-meta .dur{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;min-width:42px;text-align:right;display:inline-block;}
@media (prefers-reduced-motion: reduce){
  .tool{animation:none;}
}

/* P3 · 思考块流式结束 1.5s 后折叠成单行可展开 */
.think-c.collapsed,.think-a.collapsed{padding-top:4px;padding-bottom:4px;margin-bottom:10px;}
.think-collapsed-row{display:flex;align-items:center;gap:10px;cursor:pointer;animation:fadeIn .3s ease both;}
.think-collapsed-row .think-head-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);flex-shrink:0;}
.think-peek{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t3);font-style:italic;font-size:11.5px;letter-spacing:.005em;}
.think-caret-i{display:flex;color:var(--t3);flex-shrink:0;transition:transform .2s,color .2s;}
.think-collapsed-row:hover .think-caret-i{color:var(--t2);}
.think-collapsed-row:hover .think-peek{color:var(--t2);}
.think-head.clickable{cursor:pointer;}
.think-head .think-caret-i{margin-left:auto;}

/* ── Markdown content (streaming-markdown → smd → DOM) ─────────────────
   对齐生产链路：smd 直接操作 DOM，prose 样式用 CSS 变量实现，
   shiki 流结束后按需替换 pre>code 节点。 */
.md-content { line-height:1.85; color:var(--t1); letter-spacing:-.01em; }
.md-content > *:first-child { margin-top:0; }
.md-content > *:last-child  { margin-bottom:0; }
.md-content p  { margin:0 0 .72em; }
.md-content h1 { font-size:1.22em; font-weight:600; line-height:1.3; margin:1.4em 0 .5em; letter-spacing:-.02em; }
.md-content h2 { font-size:1.08em; font-weight:600; line-height:1.35; margin:1.1em 0 .4em; letter-spacing:-.015em; }
.md-content h3 { font-size:1em;    font-weight:600; line-height:1.45; margin:.9em 0 .3em; }
.md-content strong { font-weight:600; }
.md-content em     { font-style:italic; }
.md-content ul { list-style:disc;    padding-left:1.4em; margin:.4em 0 .72em; }
.md-content ol { list-style:decimal; padding-left:1.4em; margin:.4em 0 .72em; }
.md-content li { margin-bottom:.22em; }
.md-content li > ul, .md-content li > ol { margin:.15em 0; }
.md-content code { font-family:var(--mono); font-size:.865em; background:var(--chip); border:1px solid var(--border); border-radius:4px; padding:.1em .38em; color:var(--t1); letter-spacing:0; }
.md-content pre { background:#0d1117; border-radius:8px; padding:13px 16px; margin:.72em 0; overflow-x:auto; font-family:var(--mono); font-size:12.5px; line-height:1.65; }
.md-content pre code { background:none; border:none; padding:0; color:#e6edf3; font-size:inherit; border-radius:0; }
.md-content blockquote { border-left:2px solid var(--border); margin:.72em 0; padding:3px 0 3px 14px; color:var(--t2); font-style:italic; }
.md-content blockquote p { margin-bottom:0; }
.md-content hr  { border:none; border-top:1px solid var(--border); margin:1.1em 0; }
.md-content a   { color:inherit; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px; opacity:.7; }
.md-content a:hover { opacity:1; }
.md-content table { border-collapse:collapse; width:100%; margin:.72em 0; font-size:13px; }
.md-content th, .md-content td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
.md-content th { background:var(--sidebar); font-weight:500; color:var(--t2); font-size:11.5px; }
/* shiki 替换后的节点：保留圆角 + 字体，颜色完全由 shiki inline style 接管 */
.md-content .shiki { border-radius:8px !important; margin:.72em 0; overflow-x:auto; font-size:12.5px !important; line-height:1.65 !important; }
.md-content .shiki code { font-family:var(--mono) !important; }
[data-theme="dark"] .md-content code { background:#1e1e1e; border-color:#2a2a2a; }

.page-enter { animation: up .25s ease both; }

/* FLIP 转场：起始页→聊天页时，根容器不做整体上飘（避免叠加在眼睛 FLIP 上），
   改为内容分层淡入；眼睛 / 输入框的位移由 JS runFlip 接管。 */
.chat-flying .chat-scroll-area{animation:chatContentIn .44s ease .16s both;}
.chat-flying .chat-input-area{animation:chatContentIn .40s ease .06s both;}
@keyframes chatContentIn{from{opacity:0;}to{opacity:1;}}
@media (prefers-reduced-motion: reduce){
  .chat-flying .chat-scroll-area,.chat-flying .chat-input-area{animation:none;}
}

#root { height:100vh; }

/* Tweaks panel */
.tp {
  position:fixed;bottom:20px;right:20px;width:240px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:18px;z-index:500;
  box-shadow:var(--shadow-lg);
  animation:up .18s ease both;
}
.tp-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);margin-bottom:14px;}
.tp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.tp-label{font-size:12px;color:var(--t2);}
.tog{position:relative;width:34px;height:19px;cursor:pointer;display:inline-block;}
.tog input{opacity:0;width:0;height:0;}
.tog-track{position:absolute;inset:0;background:var(--border);border-radius:20px;}
.tog input:checked+.tog-track{background:var(--accent);}
.tog-track::before{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;}
.tog input:checked+.tog-track::before{transform:translateX(15px);}

.rename-input {
  background: transparent;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 12px;
  color: var(--t1);
  width: 100%;
  padding: 0;
}

/* ===== Workstation layout ===== */
.rail{width:56px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;flex-shrink:0;gap:4px;}
.rail-logo{width:32px;height:32px;border-radius:8px;background:var(--t1);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:13px;margin-bottom:12px;letter-spacing:-.02em;}
.rail-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;background:transparent;border:none;position:relative;}
.rail-btn:hover{background:var(--surf-hov);color:var(--t1);}
.rail-btn.active{color:var(--t1);background:var(--surf-hov);}
.rail-btn.active::before{content:'';position:absolute;left:-8px;top:8px;bottom:8px;width:2px;background:var(--t1);border-radius:0 2px 2px 0;}
.rail-spacer{flex:1;}

/* Heartbeat top strip — mood-only */
.hb{display:flex;align-items:center;padding:0 28px;height:48px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);white-space:nowrap;min-width:0;}
.hb-mood{display:inline-flex;align-items:baseline;gap:12px;}
.hb-dot{width:7px;height:7px;border-radius:50%;background:var(--mood,#22c55e);box-shadow:0 0 0 0 var(--mood-glow,#22c55e60);animation:hbPulse var(--mood-dur,2.4s) ease-in-out infinite;flex-shrink:0;align-self:center;}
.hb-label{font-family:'Space Grotesk','Noto Sans SC',sans-serif;font-size:13.5px;font-weight:500;color:var(--mood,var(--t1));letter-spacing:-.005em;}
.hb-en{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.18em;color:var(--mood,var(--t3));opacity:.55;text-transform:uppercase;}

/* mood label — secondary, after status */
.hb-mood-sep{color:var(--t3);opacity:.5;margin:0 8px;font-family:var(--mono);font-size:11px;align-self:center;}
.hb-mood-label{
  font-family:'Noto Sans SC','Space Grotesk',sans-serif;
  font-style:italic;font-size:11.5px;
  letter-spacing:.02em;
  color:var(--emotion-color, var(--t3));
  align-self:baseline;
  animation:moodIn .22s ease both;
  transition:color .35s ease,opacity .35s ease;
}
@keyframes moodIn{
  0%{opacity:0;transform:translateY(1px);letter-spacing:.1em;}
  100%{opacity:1;transform:translateY(0);letter-spacing:.02em;}
}
@keyframes hbPulse{0%,100%{box-shadow:0 0 0 0 var(--mood-glow,#22c55e60);}50%{box-shadow:0 0 0 6px transparent;}}

/* ── Persona / mood color tokens ── */
.hb[data-mood="idle"]     {--mood:#22c55e;--mood-glow:#22c55e60;--mood-dur:2.4s;}
.hb[data-mood="thinking"] {--mood:#3b82f6;--mood-glow:#3b82f680;--mood-dur:1.1s;}
.hb[data-mood="tooling"]  {--mood:#d97706;--mood-glow:#d9770680;--mood-dur:.9s;}
.hb[data-mood="writing"]  {--mood:#3b82f6;--mood-glow:#3b82f680;--mood-dur:1.3s;}
.hb[data-mood="error"]    {--mood:#dc2626;--mood-glow:#dc262680;--mood-dur:.7s;}
.hb[data-mood="asleep"]   {--mood:#7c3aed;--mood-glow:#7c3aed60;--mood-dur:3.2s;}
.hb[data-mood="drifting"] {--mood:#94a3b8;--mood-glow:#94a3b860;--mood-dur:4.2s;}
[data-theme="dark"] .hb[data-mood="idle"]     {--mood:#4ade80;}
[data-theme="dark"] .hb[data-mood="thinking"] {--mood:#60a5fa;}
[data-theme="dark"] .hb[data-mood="tooling"]  {--mood:#fbbf24;}
[data-theme="dark"] .hb[data-mood="writing"]  {--mood:#60a5fa;}
[data-theme="dark"] .hb[data-mood="error"]    {--mood:#f87171;}
[data-theme="dark"] .hb[data-mood="asleep"]   {--mood:#a78bfa;}

/* Z logo: idle breath + rare blink (legacy, still used in some places) */
@keyframes z-breath { 0%,100%{transform:scale(1);} 50%{transform:scale(.965);} }
@keyframes z-blink  { 0%,92%,100%{transform:scaleY(1);} 95%{transform:scaleY(.08);} 97%{transform:scaleY(1);} }
.z-mark{display:inline-block;transform-origin:center;animation:z-breath 4.2s ease-in-out infinite;}
.z-mark.blink{animation:z-blink 6s ease-in-out infinite;animation-delay:var(--blink-delay,3s);}
.z-mark.busy{animation:none;transform:scale(1);}

/* ── Eyes glyph (new 小Z mark) ── */
.eyes-z{display:inline-block;color:var(--t1);vertical-align:middle;}
.eyes-z .eye{transform-box:fill-box;transform-origin:center;animation:eye-blink var(--blink-dur,6s) ease-in-out infinite;}
.eyes-z .eye.eye-r{animation-delay:.04s;}
/* Task3 · 几何过渡用 ease-out 收尾曲线（fast-start / soft-settle）：被下一次 mood 打断时
   立即朝新目标走、再缓缓落定，连发也不跳动。比原 ease-in-out 更耐中断。 */
.eyes-z .pupil{transform-box:fill-box;transform-origin:center;transition:cx .36s cubic-bezier(.22,1,.36,1),cy .36s cubic-bezier(.22,1,.36,1),r .36s cubic-bezier(.22,1,.36,1);}
.eyes-z ellipse{transition:ry .36s cubic-bezier(.22,1,.36,1);}
/* 思考中（系统状态驱动，与 LLM 情绪正交）：瞳孔上抬后，只在「右上 ↔ 右」象限内缓慢游移
   + 短暂停顿，像在出神斟酌、目光投向右上方思索；不回中、不向左。略放松的眨眼。 */
.eyes-z.thinking .eye{animation:eye-blink 4.6s ease-in-out infinite;}
.eyes-z.thinking .eye.eye-r{animation-delay:.06s;}
.eyes-z.thinking .pupil{animation:pupil-think 6.5s ease-in-out infinite;}
.eyes-z.thinking .pupil.pupil-r{animation-delay:.12s;}
@keyframes pupil-think{
  0%,9%     {transform:translate(2.3px,-2.6px);}  /* 右上 */
  22%,32%   {transform:translate(3.9px,-1.3px);}  /* 右偏上 */
  44%,50%   {transform:translate(2.7px,-2.3px);}  /* 回右上 */
  62%,74%   {transform:translate(4.1px,-0.3px);}  /* 偏右 */
  86%,95%   {transform:translate(3.0px,-1.8px);}  /* 右上 */
  100%      {transform:translate(2.3px,-2.6px);}
}
/* 思考中 · 三点律动 → 移入 SVG 内中上方（与困惑 ? 号同区域） */
.think-dots{display:none;}
.z-think-dots circle{
  transform-box:fill-box;transform-origin:center;
  animation:think-dot 1.4s ease-in-out infinite;
  opacity:.28;
}
.z-think-dots circle:nth-child(2){animation-delay:.18s;}
.z-think-dots circle:nth-child(3){animation-delay:.36s;}
@keyframes think-dot{
  0%,100%{opacity:.22;transform:translateY(1px);}
  42%{opacity:.95;transform:translateY(-2px);}
}
/* Task4 · "第一反应"专属节拍：快速眨一下 → 瞳孔先收后放、定格进入该情绪表情。克制，不弹跳。
   用 !important 在节拍 0.74s 内接管 busy/mood 的瞳孔律动，结束后自动还原。 */
.eyes-z.first-react .eye{animation:first-react-blink .74s ease both !important;}
.eyes-z.first-react .eye.eye-r{animation:first-react-blink .74s ease .03s both !important;}
.eyes-z.first-react .pupil{animation:first-react-pupil .74s cubic-bezier(.22,1,.36,1) both !important;}
@keyframes first-react-blink{
  0%{transform:scaleY(1);} 12%{transform:scaleY(.07);} 27%{transform:scaleY(1);} 100%{transform:scaleY(1);}
}
@keyframes first-react-pupil{
  0%{transform:scale(1);} 20%{transform:scale(.58);} 56%{transform:scale(1.1);} 100%{transform:scale(1);}
}
/* P4 · drifting 眼神飘移：慢而随机地目光滑向一侧，维持 ~2s 再回中 */
.eyes-z.drifting .pupil{animation:pupil-drift 18s ease-in-out infinite;}
@keyframes pupil-drift{
  0%,20%,100%{transform:translate(0,0);}
  28%,44%{transform:translate(4.5px,-0.5px);}
  54%,66%{transform:translate(0,0);}
  74%,90%{transform:translate(-3.8px,0.5px);}
}
/* 难过 mood：瞳孔轻微左右游移 */
.eyes-z.sad .pupil{animation:sad-sway 10s ease-in-out infinite;}
@keyframes sad-sway{
  0%,4%      {transform:translate(0,0);}
  9%,49%     {transform:translate(-1.6px,0);}
  54%,58%    {transform:translate(0,0);}
  63%,96%    {transform:translate(1.6px,0);}
  100%       {transform:translate(0,0);}
}
/* 愉快（v0.15 rev2 · A方案正式版）：新月瞳孔漂移 + 实心红点腮红律动 */
.eyes-z.happy .happy-pupil{animation:happy-bob 9s ease-in-out infinite;}
.eyes-z.happy .pupil-r{animation-delay:.12s;}
@keyframes happy-dot-pulse{0%,100%{opacity:.82;}50%{opacity:1;}}
.eyes-z.happy .happy-dot{animation:happy-dot-pulse 3.8s ease-in-out infinite;}
.eyes-z.happy .happy-dot.r{animation-delay:.28s;}
@keyframes happy-bob{
  0%,4%      {transform:translate(0,0);}
  12%,22%    {transform:translate(1.8px,-0.9px);}
  30%,40%    {transform:translate(0,-0.5px);}
  48%,58%    {transform:translate(-1.8px,-0.9px);}
  66%,76%    {transform:translate(0.6px,-0.3px);}
  84%,100%   {transform:translate(0,0);}
}
/* 平静 mood：两眼同步缓慢游移（共轭注视），幅度随机感 */
.eyes-z.calm .pupil{animation:calm-wander 18s ease infinite;}
@keyframes calm-wander{
  0%,3%      {transform:translate(0,0);}
  6%,16%     {transform:translate(2.4px,0.5px);}
  19%,29%    {transform:translate(3.6px,-0.7px);}
  32%,40%    {transform:translate(0,0);}
  43%,53%    {transform:translate(-2.8px,1.1px);}
  56%,64%    {transform:translate(-1.0px,-1.3px);}
  67%,75%    {transform:translate(0,0);}
  78%,88%    {transform:translate(3.2px,0.4px);}
  91%,100%   {transform:translate(0,0);}
}
/* P6 · 呢吸线 + 消息间距控制 */
.breath-divider{height:24px;display:flex;align-items:center;justify-content:center;}
.chat-msg-wrap{/* margin-top 由 JS inline style 指定 */}
/* asleep（深夜/打盹）：眼睛收成细缝 + 慢速睫毛抖动，不扫视 */
.eyes-z.asleep .eye{animation:eye-flutter 12s ease-in-out infinite;}
.eyes-z.asleep .eye.eye-r{animation-delay:.08s;}
.eyes-z.asleep .pupil{animation:none;}
@keyframes eye-flutter{
  0%,80%,100%{transform:scaleY(1);}
  86%{transform:scaleY(.55);}
  90%{transform:scaleY(1);}
}
@keyframes eye-blink{
  0%,40%,46%,92%,100%{transform:scaleY(1);}
  43%{transform:scaleY(.05);}
  95%{transform:scaleY(.05);}
  97%{transform:scaleY(1);}
}
@keyframes pupil-glance{
  0%,28%,72%,100%{transform:translate(0,0);}
  34%,44%{transform:translate(2.2px,-1px);}
  56%,66%{transform:translate(-2.2px,.5px);}
}

/* P1 · error 摇头：进入 error 系统态时，整双眼睛水平轻抖一次（身体语言："不对/出错"），
   抖完即平静。一次性 .error-shake 类驱动，对 mood/思考 漂移无副作用（作用在 SVG 根，
   情绪漂移作用在 pupil 子层，两者不冲突）。 */
.eyes-z.error-shake{animation:eye-headshake .6s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes eye-headshake{
  0%  {transform:translateX(0) rotate(0);}
  13% {transform:translateX(-3.2px) rotate(-1.7deg);}
  31% {transform:translateX(2.7px)  rotate(1.3deg);}
  50% {transform:translateX(-2.1px) rotate(-1deg);}
  69% {transform:translateX(1.3px)  rotate(.6deg);}
  86% {transform:translateX(-.5px)  rotate(-.2deg);}
  100%{transform:translateX(0) rotate(0);}
}
@media (prefers-reduced-motion: reduce){
  .eyes-z.error-shake{animation:none;}
}

/* sparkle (兴奋) — 外上角闪光符号的轻微闪烁 */
.eyes-z .z-sparkle{animation:sparkle-twinkle 1.4s ease-in-out infinite;transform-origin:center;}
@keyframes sparkle-twinkle{
  0%,100%{opacity:1;}
  45%,55%{opacity:.35;}
}
/* question (困惑) — 眉心 ? 符号的浮动 */
.eyes-z .z-question{animation:question-bob 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
@keyframes question-bob{
  0%,100%{transform:translateY(0);opacity:.9;}
  50%{transform:translateY(-1.2px);opacity:1;}
}

/* Heartbeat whisper — appears next to state when idle long */
.hb-whisper{
  font-family:'Space Grotesk','Noto Sans SC',sans-serif;
  font-style:italic;font-size:11.5px;color:var(--t3);
  letter-spacing:.01em;margin-left:8px;
  animation:whisperIn 1.2s ease both;
}
@keyframes whisperIn{
  0%{opacity:0;transform:translateY(-2px);}
  18%{opacity:.85;transform:translateY(0);}
  82%{opacity:.85;}
  100%{opacity:0;transform:translateY(2px);}
}

/* Night badge */
.hb-night{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:#7c3aed;opacity:.75;
  text-transform:uppercase;
}
[data-theme="dark"] .hb-night{color:#a78bfa;}
.hb-divider{width:1px;height:14px;background:var(--border);}
.hb-cell{display:flex;align-items:center;gap:6px;}
.hb-cell-k{color:var(--t3);font-size:10px;text-transform:uppercase;letter-spacing:.12em;}
.hb-cell-v{color:var(--t1);}
.hb-spacer{flex:1;}
.hb-state{color:var(--t2);font-style:italic;font-family:'Space Grotesk','Noto Sans SC',sans-serif;font-size:12px;letter-spacing:0;}

/* Right state panel */
.sp{width:280px;border-left:1px solid var(--border);background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
.sp-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;}
.sp-h-t{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);}
.sp-body{flex:1;overflow:auto;padding:0 16px 16px;}
.sp-section{margin-bottom:22px;}
.sp-section-h{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);}
.sp-section-h .count{color:var(--t2);font-size:10px;}
.sp-card{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:11px 12px;margin-bottom:6px;font-size:12px;color:var(--t1);line-height:1.65;letter-spacing:-.005em;}
.sp-card .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:4px;display:block;}
.sp-empty{font-size:11px;color:var(--t3);padding:8px 4px;letter-spacing:.01em;}

/* ── Presence（v0.15 · 无 banner 悬浮大眼睛） ───────────────────────────
   - .presence-float：对话流顶部，无 banner，大眼睛悬浮，mood 变化双环脉冲
   - .presence-card ：右栏顶部，常驻（已弃用） */

/* B · floating presence — 无 banner，大眼睛居中悬浮 */
.presence-float{
  position:sticky;top:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;
  gap:10px;
  padding:10px 24px 18px;
  background:var(--bg);
  transition:background-color .3s;
  pointer-events:none;
}
.presence-float .presence-eyes-wrap{
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
/* mood 变化：扩散环形脉冲。Task3 · 每束光晕冻结自己的情绪色(--glow-c)、单次绽放、播完即卸；
   多束可同时在场 → 上一束未散完时，新一束优雅叠加接管，不闪烁。 */
.mood-glow{
  position:absolute;
  width:380px;height:200px;
  left:50%;top:50%;
  border-radius:50%;
  background:radial-gradient(ellipse at center, var(--glow-c, var(--emotion-color,#94a3b8)) 0%, color-mix(in oklch, var(--glow-c, var(--emotion-color,#94a3b8)), transparent 55%) 32%, transparent 70%);
  filter:blur(16px);
  pointer-events:none;
  opacity:0;
  z-index:-1;
  animation:mood-glow-bloom 2.2s cubic-bezier(.22,1,.36,1) 1 forwards;
}
@keyframes mood-glow-bloom{
  0%  {opacity:0;   transform:translate(-50%,-50%) scale(.6);}
  26% {opacity:.6;  transform:translate(-50%,-50%) scale(.95);}
  55% {opacity:.42; transform:translate(-50%,-50%) scale(1.06);}
  100%{opacity:0;   transform:translate(-50%,-50%) scale(1.28);}
}
/* 常驻呼吸光晕：情绪保持期间垫在最底层，很淡、缓慢明灭，给单一情绪"反复绽放"的余韵。
   用实时 var(--emotion-color)（已 @property 化）→ 换情绪时颜色随之融变；burst 绽放叠在其上。 */
.mood-ambient{
  position:absolute;
  width:340px;height:180px;
  left:50%;top:50%;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center, var(--emotion-color,#94a3b8) 0%, color-mix(in oklch, var(--emotion-color,#94a3b8), transparent 48%) 36%, transparent 70%);
  filter:blur(18px);
  pointer-events:none;
  z-index:-2;
  opacity:0;
  transition:opacity .6s ease;
}
.mood-ambient.on{animation:mood-ambient-breath 4.4s ease-in-out infinite;}
@keyframes mood-ambient-breath{
  0%,100%{opacity:.20; transform:translate(-50%,-50%) scale(.95);}
  50%    {opacity:.36; transform:translate(-50%,-50%) scale(1.05);}
}
.home-eyes .mood-ambient{width:440px;height:225px;}
/* home 页眼睛更大，光晕更宽 */
.home-eyes .mood-glow{width:500px;height:250px;}
.presence-float .presence-label{
  display:inline-flex;align-items:baseline;gap:8px;
  font-size:12px;letter-spacing:-.005em;
  pointer-events:auto;
  transition:opacity .3s;
}
.presence-float .presence-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--mood-color);
  box-shadow:0 0 0 0 color-mix(in oklab, var(--mood-color), transparent 55%);
  animation:hbPulse 2.4s ease-in-out infinite;
  align-self:center;
  flex-shrink:0;
}
.presence-float[data-mood="asleep"] .presence-dot{animation-duration:3.2s;}
.presence-float .presence-status{display:inline-flex;align-items:baseline;gap:8px;}
.presence-float .presence-status .status-zh{
  font-family:'Space Grotesk','Noto Sans SC',sans-serif;
  font-size:13px;font-weight:500;
  color:var(--mood-color);
  letter-spacing:-.005em;
}
.presence-float .presence-status .status-en{
  font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--mood-color);opacity:.55;
}
.presence-float .presence-sep{
  color:var(--t3);opacity:.5;
  font-family:var(--mono);font-size:11px;
}
.presence-float .presence-mood{
  font-family:'Noto Sans SC','Space Grotesk',sans-serif;
  font-style:italic;font-size:12px;
  color:var(--emotion-color, var(--t2));
  letter-spacing:.02em;
  animation:moodIn .26s ease both;
}

/* C · 右栏 Presence Card（v0.14 rev6 已弃用，保留 CSS 备用，但 React 端不再渲染） */
.presence-card{
  position:relative;
  margin:0 0 18px;
  padding:22px 16px 18px;
  background:var(--surface);
  border:1px solid var(--border-lt);
  border-radius:12px;
  display:none; /* 弃用 */
}
.sp-impression{display:flex;flex-direction:column;gap:4px;padding:11px 12px;}
.imp-row{display:flex;align-items:baseline;font-size:12px;line-height:1.55;}
.imp-k{width:44px;flex-shrink:0;color:var(--t3);font-size:11.5px;letter-spacing:.01em;}
.imp-v{color:var(--t1);font-size:12.5px;letter-spacing:-.005em;}
.imp-empty{color:var(--t3);font-size:11.5px;letter-spacing:.01em;}

/* v0.14 — Hot Memory 两区（档案 / 印象） */
.sp-impression-v14{padding:0;}
.imp-zone{padding:11px 12px;}
.imp-zone + .imp-zone{border-top:1px dashed var(--border);}
.imp-zone-h{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--t3);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.imp-zone-h::before{
  content:'';display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--t3);
}
.imp-outer-row{display:flex;align-items:baseline;font-size:12px;line-height:1.7;}
.imp-outer-row .imp-k{width:46px;}
.imp-outer-row .imp-v{color:var(--t1);font-size:12.5px;letter-spacing:-.005em;}
.imp-inner-row{margin-bottom:9px;}
.imp-inner-row:last-child{margin-bottom:0;}
.imp-inner-k{
  font-size:11px;color:var(--t3);letter-spacing:.04em;
  margin-bottom:2px;font-family:'Space Grotesk','Noto Sans SC',sans-serif;
}
.imp-inner-v{
  font-size:12.5px;color:var(--t1);line-height:1.6;
  letter-spacing:-.005em;font-style:italic;
}
.imp-counter{
  font-family:var(--mono);font-size:9.5px;color:var(--t3);
  letter-spacing:.06em;margin-left:auto;
}
.imp-hint{
  font-size:11px;color:var(--t3);font-style:italic;
  letter-spacing:.005em;line-height:1.55;padding:2px 0;
}

/* significant-event 叙事便签 */
/* ── memory anchors (v0.145) ─── 三层衰减摘要 */
.anchor-tier{margin-top:10px;}
.anchor-tier:first-child{margin-top:0;}
.anchor-tier-h{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--t3);
  margin-bottom:6px;display:flex;align-items:center;gap:6px;
  cursor:default;
}
.anchor-tier-h.clickable{cursor:pointer;user-select:none;}
.anchor-tier-h.clickable:hover{color:var(--t2);}
.anchor-tier-h .anchor-chev{
  display:inline-flex;align-items:center;justify-content:center;
  width:9px;height:9px;color:var(--t3);
  transition:transform .25s ease;
}
.anchor-tier-h.open .anchor-chev{transform:rotate(90deg);}
.anchor-tier-h .anchor-tier-count{
  margin-left:auto;color:var(--t3);
  font-size:9.5px;letter-spacing:.06em;
}
/* near：完整卡 */
.anchor-near-card{
  padding:11px 12px;margin-bottom:6px;
  font-size:12.5px;color:var(--t1);line-height:1.65;
  letter-spacing:-.005em;
}
.anchor-near-card .anchor-title{
  font-size:13px;font-weight:500;color:var(--t1);
  letter-spacing:-.005em;margin-bottom:5px;
  font-family:'Space Grotesk','Noto Sans SC',sans-serif;
}
.anchor-near-card .anchor-body{
  color:var(--t2);font-size:12px;line-height:1.65;
  letter-spacing:-.005em;
}
.anchor-near-card .anchor-meta{
  margin-top:8px;display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:9.5px;color:var(--t3);
  letter-spacing:.06em;
}
.anchor-near-card .anchor-meta-mood{
  display:inline-flex;align-items:center;gap:3px;
  color:var(--t2);font-family:'Space Grotesk','Noto Sans SC',sans-serif;
  font-size:10px;letter-spacing:0;
}
.anchor-near-card .anchor-meta-mood::before{
  content:'';width:4px;height:4px;border-radius:50%;
  background:var(--accent);display:inline-block;
}
.anchor-near-toggle{
  background:transparent;border:none;cursor:pointer;
  width:100%;text-align:center;padding:5px 0;
  font-family:var(--mono);font-size:9.5px;color:var(--t3);
  letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.anchor-near-toggle:hover{color:var(--t1);}
/* mid：紧凑单行 */
.anchor-mid-row{
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;margin-bottom:4px;
  font-size:12px;color:var(--t1);
  letter-spacing:-.005em;line-height:1.5;
  border-radius:8px;
  border:1px solid var(--border);background:var(--surface);
}
.anchor-mid-row .anchor-mid-title{
  flex:1;min-width:0;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.anchor-mid-row .anchor-mid-time{
  flex-shrink:0;font-family:var(--mono);font-size:9.5px;
  color:var(--t3);letter-spacing:.06em;
}
.anchor-mid-row .anchor-mid-mood{
  flex-shrink:0;width:5px;height:5px;border-radius:50%;
  background:var(--accent);
}
/* far：合并条 */
.anchor-far-row{
  padding:8px 12px;margin-bottom:0;
  font-size:11.5px;color:var(--t2);
  font-style:italic;letter-spacing:.005em;line-height:1.55;
  border-radius:8px;background:transparent;
  border:1px dashed var(--border);
}
.anchor-far-row .anchor-far-count{
  color:var(--t1);font-style:normal;font-weight:500;
  margin-right:4px;
}
.anchor-empty{
  font-size:11.5px;color:var(--t3);font-style:italic;
  letter-spacing:.005em;padding:6px 2px;
}

.sp-event{
  padding:10px 12px;line-height:1.6;font-size:12.5px;color:var(--t1);
  letter-spacing:-.005em;display:flex;gap:9px;align-items:flex-start;
}
.sp-event-mark{
  flex-shrink:0;margin-top:5px;width:3px;height:3px;border-radius:50%;
  background:var(--t2);
}

/* commitment 方向化卡 */
.sp-commit{
  padding:10px 12px;font-size:12.5px;color:var(--t1);line-height:1.6;
  letter-spacing:-.005em;display:flex;gap:10px;align-items:flex-start;
}
.commit-arrow{
  flex-shrink:0;font-family:var(--mono);font-size:13px;
  width:18px;text-align:center;line-height:1.5;margin-top:0;
  color:var(--t2);font-weight:500;
}
.commit-arrow.ai     {color:#0891b2;}
.commit-arrow.user   {color:#d97706;}
.commit-arrow.mutual {color:var(--t1);}
[data-theme="dark"] .commit-arrow.ai    {color:#22d3ee;}
[data-theme="dark"] .commit-arrow.user  {color:#fbbf24;}
.commit-body{flex:1;min-width:0;}
.commit-meta{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--t3);margin-bottom:2px;
}
.commit-text{color:var(--t1);}

/* "回顾" 触发按钮 */
.lookback-btn{
  background:transparent;border:none;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--t3);padding:2px 4px;
  display:inline-flex;align-items:center;gap:4px;
}
.lookback-btn:hover{color:var(--t1);}

/* Lookback modal */
.lb-backdrop{
  position:fixed;inset:0;z-index:300;
  background:oklch(0 0 0 / 0.34);
  backdrop-filter:blur(3px);
  animation:fadeIn .18s ease both;
  display:flex;align-items:center;justify-content:center;padding:48px;
}
.lb-modal{
  width:min(960px, 100%);max-height:min(86vh, 720px);
  background:var(--bg);border:1px solid var(--border);

const {useState,useEffect,useRef,useCallback,useLayoutEffect}=React;

/* ── FLIP 转场助手：把 el 从 fromRect（旧位置/尺寸）"放回"，再补间回 0 ──
   起始页→聊天页时，眼睛 / 输入框看起来是同一元素在连续移动，而非先消失再出现。
   scale=true 时按宽度比缩放（眼睛 80→60）；scale=false 仅平移（输入框，避免圆角变形）。
   reduced-motion 下直接跳过，元素在终点原位出现。 */
function runFlip(el, fromRect, {scale=true, dur=0.46}={}){
  if(!el || !fromRect) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const to = el.getBoundingClientRect();
  if(!to.width || !to.height) return;
  const fcx=fromRect.left+fromRect.width/2, fcy=fromRect.top+fromRect.height/2;
  const tcx=to.left+to.width/2,             tcy=to.top+to.height/2;
  const dx=fcx-tcx, dy=fcy-tcy;
  const s = scale ? (fromRect.width/to.width) : 1;
  if(Math.abs(dx)<0.5 && Math.abs(dy)<0.5 && Math.abs(s-1)<0.01) return;
  el.style.transformOrigin='center center';
  el.style.transition='none';
  el.style.transform=`translate(${dx}px,${dy}px) scale(${s})`;
  void el.offsetWidth; // 强制回流，让初始 transform 立即生效
  requestAnimationFrame(()=>{
    el.style.transition=`transform ${dur}s cubic-bezier(.4,0,.2,1)`;
    el.style.transform='translate(0,0) scale(1)';
    const cleanup=()=>{
      el.style.transition=''; el.style.transform=''; el.style.transformOrigin=''; el.style.willChange='';
      el.removeEventListener('transitionend',cleanup);
    };
    el.addEventListener('transitionend',cleanup);
  });
}

const HOT_TOTAL = HOT_MEMORY_ALL.length; // 10

/* ── Intimacy 三档（与后端 fill_ratio 同步） ── */
function intimacyMode(hot){
  if(!hot) return 'stranger';
  const filled = HOT_MEMORY_ALL.filter(f=>hot[f.key] && String(hot[f.key]).trim()).length;
  const r = filled / HOT_TOTAL;
  if(r < 0.3) return 'stranger';
  if(r < 0.7) return 'half-known';
  return 'fully-known';
}
function filledCount(hot){
  if(!hot) return 0;
  return HOT_MEMORY_ALL.filter(f=>hot[f.key] && String(hot[f.key]).trim()).length;
}

/* ── commitment value 前缀解析 → 承诺方向 ── */
function parseCommitment(text){
  if(!text) return {dir:'mutual', body:text};
  // 我（AI）答应XXX：...
  let m = text.match(/^我（AI）答应([^：:]+)[：:]\s*(.+)$/);
  if(m) return {dir:'ai',     who:m[1].trim(), body:m[2].trim()};
  m = text.match(/^我\(AI\)答应([^：:]+)[：:]\s*(.+)$/);
  if(m) return {dir:'ai',     who:m[1].trim(), body:m[2].trim()};
  // XXX答应我：...
  m = text.match(/^([^：:]{1,12})答应我[：:]\s*(.+)$/);
  if(m) return {dir:'user',   who:m[1].trim(), body:m[2].trim()};
  // 我们约定：...
  m = text.match(/^我们(约定|说好)[：:]\s*(.+)$/);
  if(m) return {dir:'mutual', body:m[2].trim()};
  return {dir:'mutual', body:text};
}

/* P3 · 流式结束 1.5s 后把思考块折叠成单行；用户可点开/再收起。
   折叠不依赖任何外部状态，纯组件内自治。 */
function useAutoCollapse(streaming, delay=1500){
  const [collapsed,setCollapsed]=useState(false);
  const [userOpen,setUserOpen]=useState(false);
  const prevStream=useRef(streaming);
  useEffect(()=>{
    let t;
    if(prevStream.current && !streaming){
      t=setTimeout(()=>setCollapsed(true), delay);
    }
    prevStream.current=streaming;
    return ()=>{ if(t) clearTimeout(t); };
  },[streaming,delay]);
  const open = !collapsed || userOpen;
  return {open, collapsible:!streaming, toggle:()=>setUserOpen(o=>!o)};
}

}

/* Tool call panel */
function fmtToolDur(ms){
  return ms<1000 ? Math.round(ms)+'ms' : (ms/1000).toFixed(2)+'s';
}
function ToolCall({name,status,duration,params,result,defaultOpen}){
  const [open,setOpen]=useState(defaultOpen??false);
  const statusText=status==='running'?'运行中':status==='error'?'出错':'完成';

  // ② running 计时跳动：running 期间每帧累加 elapsed，落定后显示最终 duration
  const [elapsed,setElapsed]=useState(0);
  useEffect(()=>{
    if(status!=='running') return;
    const t0=performance.now();
    setElapsed(0);
    const iv=setInterval(()=>setElapsed(performance.now()-t0), 70);
    return ()=>clearInterval(iv);
  },[status]);
  const durText = status==='running' ? fmtToolDur(elapsed) : duration;

  // ③ 完成 0.4s 后、若未展开 → 收扁（hover 由 CSS 还原）
  const [flat,setFlat]=useState(false);
  useEffect(()=>{
    if((status==='done'||status==='error') && !open){
      const t=setTimeout(()=>setFlat(true), 400);
      return ()=>clearTimeout(t);
    }
    setFlat(false);
  },[status,open]);

  const [hovered, setHovered] = useState(false);
  // flat 收扁时 hover 预览 body（body 须在 DOM 中，CSS hover 无法凭空渲染）
  const showBody = open || (flat && hovered);

  return(
    <div className={`tool${flat?' flat':''}`}
      onMouseEnter={()=>setHovered(true)}
      onMouseLeave={()=>setHovered(false)}
    >
      <div className={`tool-head ${open?'':'closed'}`} onClick={()=>setOpen(o=>!o)}>
        <span className={`tool-dot ${status}`}/>
        <span className="tool-name">{name}</span>
        <span className="tool-meta">
          <span>{statusText}</span>
          <span className="sep"/>
          <span className="dur">{durText}</span>
        </span>
        <span className={`tool-caret ${open?'open':''}`}>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </div>
      {showBody&&(
        <div className="tool-body" style={flat&&!open?{opacity:0,pointerEvents:'none'}:undefined}>
          {params&&<><span className="lbl">parameters</span><div className="v">{params}</div></>}
          {result&&<><span className="lbl">result</span><div className="v">{result}</div></>}
        </div>
      )}
    </div>
  );
}

/* ── applyShiki：流结束后扫描 pre>code，用 shiki github-dark 替换 ── */
let _shikiPromise = null;
function _loadShiki(){
  if(_shikiPromise) return _shikiPromise;
  _shikiPromise = new Promise(resolve=>{
    const s=document.createElement('script');
    s.type='module';
    s.textContent=`
      import { codeToHtml } from 'https://esm.sh/shiki@1.24.0';
      window.__shikiCodeToHtml = codeToHtml;
      document.dispatchEvent(new Event('__shiki_ready'));
    `;
    document.head.appendChild(s);
    document.addEventListener('__shiki_ready',()=>resolve(window.__shikiCodeToHtml),{once:true});
  });
  return _shikiPromise;
}
async function applyShiki(container){
  const pres=[...container.querySelectorAll('pre')];
  if(!pres.length) return;
  try{
    const codeToHtml=await _loadShiki();
    for(const pre of pres){
      if(pre.classList.contains('shiki')) continue;
      const code=pre.querySelector('code');
      if(!code) continue;
      const raw=code.textContent||'';
      const cls=code.className||'';
      const m=cls.match(/language-(\w+)/);
      const lang=m?m[1]:'text';
      try{
        const html=await codeToHtml(raw,{lang,theme:'github-dark'});
        const tmp=document.createElement('div');
        tmp.innerHTML=html;
        const node=tmp.firstElementChild;
        if(node) pre.replaceWith(node);
      }catch{ /* unknown lang — keep plain */ }
    }
  }catch(e){ console.warn('[shiki]',e); }
}

/* ── StreamingContent：对齐生产 stream-markdown.tsx 链路 ──
   smd 直接操作容器 DOM（绕过 React reconcile），
   text 增量喂给 parser，streaming→false 时 parser_end + applyShiki。 */
function StreamingContent({text, streaming}){
  const elRef  = React.useRef(null);
  const sRef   = React.useRef({parser:null, written:0, ended:false});

  /* 核心解析逻辑，抽成独立函数供 effect 和 smd_ready 回调复用 */
  function runParse(){
    const el  = elRef.current;
    if(!el) return;
    const smd = window.__smd;
    const s   = sRef.current;
    if(s.ended) return;

    /* 初始化 parser（smd ready 后首次调用） */
    if(!s.parser && smd){
      el.innerHTML='';
      s.parser  = smd.parser(smd.default_renderer(el));
      s.written = 0;
    }

    /* 写新增字符 */
    if(s.parser && text.length > s.written){
      smd.parser_write(s.parser, text.slice(s.written));
      s.written = text.length;
    }

    /* 流结束：flush + parser_end + shiki */
    if(!streaming && s.parser && !s.ended){
      if(text.length > s.written){
        smd.parser_write(s.parser, text.slice(s.written));
        s.written = text.length;
      }
      smd.parser_end(s.parser);
      s.parser = null;
      s.ended  = true;
      applyShiki(el);
    }
  }

  /* 写增量 + 流结束处理 */
  React.useEffect(()=>{
    if(!window.__smd){
      /* smd 尚未加载：纯文本兜底，并注册一次性监听——ready 后补刷 */
      const el = elRef.current;
      if(el && !sRef.current.parser) el.textContent = text;
      const onReady = ()=>{ runParse(); };
      document.addEventListener('__smd_ready', onReady, {once:true});
      return ()=>document.removeEventListener('__smd_ready', onReady);
    }
    runParse();
  },[text, streaming]);

  /* 组件卸载时清理未结束的 parser */
  React.useEffect(()=>()=>{
    const s=sRef.current;
    if(s.parser){ try{ window.__smd?.parser_end(s.parser); }catch{} s.parser=null; }
  },[]);

  /* 链接拦截：统一新窗口打开 */
  function handleClick(e){
    const a=e.target.closest('a');
    if(a){ e.preventDefault(); window.open(a.href,'_blank','noopener'); }
  }

  return <div ref={elRef} className="md-content" onClick={handleClick}
    style={{fontSize:14.5,padding:'2px 0'}} />;
}

/* Chat item with hover delete + double-click rename */
function ChatItem({c,active,onSelect,onDelete,onRename}){
  const [hovered,setHovered]=useState(false);
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(c.title);
  const inputRef=useRef(null);

  useEffect(()=>{ if(editing && inputRef.current){ inputRef.current.focus(); inputRef.current.select(); } },[editing]);

  function commitRename(){
    const v=val.trim();
    onRename(v||c.title);
    setVal(v||c.title);
    setEditing(false);
  }

  return(
    <div
      onClick={()=>{ if(!editing) onSelect(); }}
      onMouseEnter={()=>setHovered(true)}
      onMouseLeave={()=>setHovered(false)}
      onDoubleClick={()=>setEditing(true)}
      style={{
        display:'flex',alignItems:'center',gap:8,
        padding:'8px 8px',
        borderRadius:7,cursor:'pointer',marginBottom:1,
        background:active?'var(--surf-hov)':'transparent',
        borderLeft:active?'2px solid var(--accent)':'2px solid transparent',
        position:'relative',
      }}
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
        stroke={active?'var(--accent)':'var(--t3)'} strokeWidth="1.7" style={{flexShrink:0}}>
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <div style={{flex:1,minWidth:0}}>
        {editing ? (
          <input ref={inputRef} className="rename-input" value={val}
            onChange={e=>setVal(e.target.value)}
            onBlur={commitRename}
            onKeyDown={e=>{ if(e.key==='Enter') commitRename(); if(e.key==='Escape'){setVal(c.title);setEditing(false);} }}
            onClick={e=>e.stopPropagation()}
          />
        ) : (
          <div style={{fontSize:12,color:active?'var(--t1)':'var(--t2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.title}</div>
        )}
        {!editing && <div style={{fontSize:10,color:'var(--t3)',marginTop:1}}>{c.t}</div>}
      </div>
      {/* Delete button */}
      {hovered && !editing && (
        <button onClick={e=>{e.stopPropagation();onDelete();}} style={{
          width:20,height:20,borderRadius:5,border:'none',
          background:'transparent',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',
          color:'var(--t3)',flexShrink:0,padding:0,
          transition:'color .12s',
        }}
        onMouseEnter={e=>e.currentTarget.style.color='var(--t1)'}
        onMouseLeave={e=>e.currentTarget.style.color='var(--t3)'}

          </svg>
        </button>
      )}
    </div>
  );
}

/* asleep 专用形态（与 mood 正交）：眼变细缝、瞳孔下沉变小 */
const ASLEEP_EXPR = {pr:2.0, pdy:2.4, esy:0.26, blink:8, liddy:0, lidty:0, lidSlant:0};
/* 思考中专用形态（系统状态驱动，与 mood 正交）：瞳孔上抬、眼睛略放松，配合 .thinking 漂移 */
const THINKING_EXPR = {pr:3.0, pdy:-1.4, esy:0.95, blink:5, liddy:0, lidty:0, lidSlant:0};

/* ── User-activity context（与 mood 正交，叠加到 Eyes 上） ──
   normal / long-silence / high-intensity */
function applyContext(e, ctx){
  if(ctx==='long-silence'){
    const r = {...e,
      blink: e.blink * 1.5,
      pdy:   (e.pdy||0) + 0.6,
      esy:   Math.max(0.35, e.esy * 0.78),
      liddy: (e.liddy||0) + 2.4,
    };
    if(e.esyR!==undefined)  r.esyR  = Math.max(0.2, e.esyR * 0.78);
    if(e.liddyR!==undefined) r.liddyR = (e.liddyR||0) + 2.4;
    return r;
  }
  if(ctx==='high-intensity'){
    const r = {...e,
      blink: e.blink * 0.6,
      pr:    e.pr * 1.08,
      prR:   (e.prR || e.pr) * 1.08,
      esy:   Math.min(1.15, e.esy * 1.02),
    };
    if(e.esyR!==undefined) r.esyR = Math.min(1.15, e.esyR * 1.02);
    return r;
  }
  return e;
}

/* ── Intimacy → default mood when no explicit mood ── */
const INTIMACY_DEFAULT_MOOD = {
  'stranger':   '好奇',
  'half-known': '愉快',
  'fully-known':'愉快',
};

/* ── Eyes glyph — v0.15: 重构，平静用 CSS class 驱动漂移，无 JS 竞态 ── */
let _eyesUid = 0;
function Eyes({size=64, busy=false, color, pupil, mood, context, asleep=false, drifting=false, lookDown=false, waking=false, thinking=false, beatKey=0, errorKey=0}){
  const uidRef = useRef(null);
  if(uidRef.current===null){ _eyesUid++; uidRef.current = _eyesUid; }
  const uid = uidRef.current;

  // ── 第一反应节拍：beatKey 变化 → 加 .first-react 类播放一次（0.74s 后自动还原）──
  const [beating, setBeating] = useState(false);
  const beatTimerRef = useRef(null);
  const prevBeatRef = useRef(beatKey);
  useEffect(()=>{
    if(beatKey>0 && beatKey!==prevBeatRef.current){
      setBeating(true);
      clearTimeout(beatTimerRef.current);
      beatTimerRef.current = setTimeout(()=>setBeating(false), 760);
    }
    prevBeatRef.current = beatKey;
    return ()=>clearTimeout(beatTimerRef.current);
  },[beatKey]);

  // ── P1 · error 摇头节拍：errorKey 上升沿 → 加 .error-shake 播放一次（0.6s 后还原）──
  const [shaking, setShaking] = useState(false);
  const shakeTimerRef = useRef(null);
  const prevErrRef = useRef(errorKey);
  useEffect(()=>{
    if(errorKey>0 && errorKey!==prevErrRef.current){
      setShaking(true);
      clearTimeout(shakeTimerRef.current);
      shakeTimerRef.current = setTimeout(()=>setShaking(false), 640);
    }
    prevErrRef.current = errorKey;
    return ()=>clearTimeout(shakeTimerRef.current);
  },[errorKey]);

  // ── 唤醒动画：esy 从 0.26 插值到目标值（RAF，仅 waking=true 时运行）──
  const [wakingEsy, setWakingEsy] = useState(null);
  const wakingRafRef = useRef(null);
  useEffect(()=>{
    if(waking){
      const from = ASLEEP_EXPR.esy;
      const to   = ((mood && MOOD_EXPR[mood]) || DEFAULT_EXPR).esy;
      const dur  = 1400;
      const t0   = performance.now();
      function step(now){
        const p    = Math.min(1,(now-t0)/dur);
        const ease = p<0.5 ? 2*p*p : -1+(4-2*p)*p;
        setWakingEsy(from+(to-from)*ease);
        if(p<1) wakingRafRef.current=requestAnimationFrame(step);
        // 动画完成：保留最终值，眼睛维持睁开状态
      }
      cancelAnimationFrame(wakingRafRef.current);
      wakingRafRef.current=requestAnimationFrame(step);
    } else {
      cancelAnimationFrame(wakingRafRef.current);
      setWakingEsy(null);
    }
    return ()=>cancelAnimationFrame(wakingRafRef.current);
  },[waking]);

  // ── 几何量计算 ──
  const w    = Math.round(size * 2.2);
  const h    = size;
  const fill = color || 'currentColor';
  const pp   = pupil  || 'var(--bg)';
  const base = waking
    ? { ...ASLEEP_EXPR, esy: wakingEsy ?? ASLEEP_EXPR.esy }
    : asleep ? ASLEEP_EXPR
    : thinking ? THINKING_EXPR
    : ((mood && MOOD_EXPR[mood]) || DEFAULT_EXPR);
  const e        = (asleep||thinking) ? base : applyContext(base, context);
  const pdxBoth  = e.pdx || 0;
  // 打字时向下注视（好奇/兴奋专注盯看，不受 lookDown 影响）
  const pupilShift = (lookDown && !asleep && !waking && !thinking) ? ((mood==='好奇'||mood==='兴奋') ? 7.0 : 4.5) : 0;
  // L 眼
  const ryL    = (17 * e.esy).toFixed(2);
  const prL    = e.pr;
  const cxL    = 28 + pdxBoth;
  const cyL    = 22 + (e.pdy || 0) + pupilShift;
  const liddyL = e.liddy || 0;
  const lidtyL = e.lidty || 0;
  // R 眼
  const esyR   = e.esyR   !== undefined ? e.esyR   : e.esy;
  const ryR    = (17 * esyR).toFixed(2);
  const prR    = e.prR    || e.pr;
  const cyR    = 22 + (e.pdy || 0) + pupilShift;
  const cxR    = 72 + (e.pdxR || 0) + pdxBoth;
  const liddyR = e.liddyR !== undefined ? e.liddyR : liddyL;
  const lidtyR = e.lidtyR !== undefined ? e.lidtyR : lidtyL;
  const slant  = e.lidSlant || 0;
  // clip polygon — 动态边界，避免 esy>1 时截边
  const maskL    = `eyeMaskL_${uid}`;
  const maskR    = `eyeMaskR_${uid}`;
  const eyeTopL  = Math.min(5, Math.round(22 - parseFloat(ryL)));
  const eyeBotL  = Math.max(39, Math.round(22 + parseFloat(ryL)));
  const eyeTopR  = Math.min(5, Math.round(22 - parseFloat(ryR)));
  const eyeBotR  = Math.max(39, Math.round(22 + parseFloat(ryR)));
  const polyL    = `14,${eyeTopL+liddyL} 42,${eyeTopL+liddyL+slant} 42,${eyeBotL-lidtyL} 14,${eyeBotL-lidtyL}`;
  const polyR    = `58,${eyeTopR+liddyR+slant} 86,${eyeTopR+liddyR} 86,${eyeBotR-lidtyR} 58,${eyeBotR-lidtyR}`;
  // 平静 / 愉快时才漂移；其他情绪专注，瞳孔固定
  const calmDrift = mood==='平静' && !drifting && !asleep && !waking && !busy && !lookDown && !thinking;
  const happyDrift = mood==='愉快' && !drifting && !asleep && !waking && !busy && !lookDown && !thinking;
  // 愉快：保留小Z的圆眼+瞳孔身份，但下眼睑上扬成笑弧（曲线裁剪）、
  // 瞳孔换大上移 + 暖颊光 → 一眼辛能看出在笑，又不丢识别度，且与「难过」（直抬下睑+瞳孔下望）截然不同。
  const happyFace = mood==='愉快' && !asleep && !waking && !thinking && !drifting;

  return(
    <svg
      className={`eyes-z${thinking?' thinking':''}${(asleep&&!waking)?' asleep':''}${drifting?' drifting':''}${waking?' waking':''}${calmDrift?' calm':''}${happyDrift?' happy':''}${mood==='难过'&&!drifting&&!asleep&&!lookDown&&!thinking?' sad':''}${beating?' first-react':''}${shaking?' error-shake':''}`}
      width={w} height={h} viewBox="0 0 100 44" fill="none"
      style={{'--blink-dur':`${e.blink}s`,'overflow':'visible'}}
      shapeRendering="geometricPrecision"
      aria-label={`小Z${mood?'·'+mood:''}`} role="img"
    >
      <defs>
        <clipPath id={maskL}><polygon points={polyL}/></clipPath>
        <clipPath id={maskR}><polygon points={polyR}/></clipPath>

      </defs>
      <g className="eye eye-l" clipPath={`url(#${maskL})`} style={{display: happyFace?'none':undefined}}>
        <ellipse cx="28" cy="22" rx="13" ry={ryL} fill={fill}/>
        <circle className="pupil pupil-l" cx={cxL} cy={cyL} r={prL} fill={pp}/>
      </g>
      <g className="eye eye-r" clipPath={`url(#${maskR})`} style={{display: happyFace?'none':undefined}}>
        <ellipse cx="72" cy="22" rx="13" ry={ryR} fill={fill}/>
        <circle className="pupil pupil-r" cx={cxR} cy={cyR} r={prR} fill={pp}/>
      </g>
      {happyFace && (
        <g className="happy-face">
          <circle className="happy-dot" cx="11" cy="37" r="2.9" fill="#f06070"/>
          <circle className="happy-dot r" cx="89" cy="37" r="2.9" fill="#f06070"/>
          <g className="eye eye-l" clipPath={`url(#${maskL})`}>
            <ellipse cx="28" cy="22" rx="13" ry={ryL} fill={fill}/>
            <g className="pupil happy-pupil pupil-l">
              <circle cx="28" cy="22" r="3.9" fill={pp}/>
              <circle cx="28" cy="25.1" r="3.55" fill={fill}/>
            </g>
          </g>
          <g className="eye eye-r" clipPath={`url(#${maskR})`}>
            <ellipse cx="72" cy="22" rx="13" ry={ryR} fill={fill}/>
            <g className="pupil happy-pupil pupil-r">
              <circle cx="72" cy="22" r="3.9" fill={pp}/>
              <circle cx="72" cy="25.1" r="3.55" fill={fill}/>
            </g>
          </g>
        </g>
      )}
      {thinking && !asleep && (
        <g className="z-think-dots">
          <circle cx="41" cy="-2" r="1.8" fill={fill}/>
          <circle cx="50" cy="-2" r="1.8" fill={fill}/>
          <circle cx="59" cy="-2" r="1.8" fill={fill}/>
        </g>
      )}
      {e.sparkle && (
        <g className="z-sparkle">
          <polygon points="12,1.5 13,4.3 15.5,5 13,5.7 12,8.5 11,5.7 8.5,5 11,4.3" fill={fill}/>
          <polygon points="88,1.5 89,4.3 91.5,5 89,5.7 88,8.5 87,5.7 84.5,5 87,4.3" fill={fill}/>
          <circle cx="17" cy="12.5" r="0.9" fill={fill}/>
          <circle cx="83" cy="12.5" r="0.9" fill={fill}/>
        </g>
      )}
      {e.question && (
        <g className="z-question">
          <path d="M 47,4 Q 50,1 53,4 Q 53,7 50,8.5 L 50,10.5"
                stroke={fill} strokeWidth="1.1" fill="none"
                strokeLinecap="round" strokeLinejoin="round"/>
          <circle cx="50" cy="12.6" r="0.95" fill={fill}/>
        </g>
      )}
      {/* ── Mouth ── */}
      {!asleep && (()=>{
        const sp = {fill:'none', stroke:fill, strokeLinecap:'round'};
        if(thinking)      return <path d="M 46,40 L 54,40" {...sp} strokeWidth="2.0"/>;
        if(mood==='愉快') return <path d="M 41,40 Q 50,45.5 59,40" {...sp} strokeWidth="2.0"/>;
        if(mood==='平静') return <path d="M 44,40 Q 50,42 56,40" {...sp} strokeWidth="2.0"/>;
        if(mood==='好奇') return <ellipse cx="50" cy="43" rx="4.2" ry="3.5" fill={fill}/>;
        if(mood==='兴奋') return <path d="M 39,40 Q 50,47 61,40" {...sp} strokeWidth="2.2"/>;
        if(mood==='困惑') return <path d="M 43,41 Q 46.5,39 50,41 Q 53.5,43 57,41" {...sp} strokeWidth="2.0"/>;
        if(mood==='难过') return <path d="M 43,38 Q 50,33 57,38" {...sp} strokeWidth="2.0"/>;
        if(mood==='愤怒') return (<g>
          <rect x="41" y="37.5" width="18" height="6" rx="1.5" fill={fill}/>
          <rect x="42.5" y="38.5" width="15" height="2" rx="0.5" fill={pp} opacity="0.9"/>
          <rect x="42.5" y="40.7" width="15" height="1.8" rx="0.5" fill={pp} opacity="0.75"/>
        </g>);
        return <path d="M 44,40 Q 50,42 56,40" {...sp} strokeWidth="2.0"/>;
      })()}
    </svg>
  );
}

/* ── 情绪色查表（与 CSS token 对齐，供光晕冻结自身颜色用，亮/暗各一套） ── */
const EMOTION_HEX = {
  light:{'愉快':'#10b981','平静':'#78b4a0','好奇':'#06b6d4','兴奋':'#f59e0b','困惑':'#a855f7','难过':'#5b80c0','愤怒':'#ef4444'},
  dark: {'愉快':'#34d399','平静':'#8ecabc','好奇':'#22d3ee','兴奋':'#fbbf24','困惑':'#c084fc','难过':'#7d9fde','愤怒':'#f87171'},
};
function emotionHex(mood){
  const t = document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  return (EMOTION_HEX[t]||EMOTION_HEX.light)[mood] || '#94a3b8';
}

/* ── 光晕池 + 首反应节拍 hook（PresenceFloat / Home 共用） ──
   每个 mood 事件（瞬时 / 行内）都会 triggerSpotlight()：
   · 新增一束"冻结当前情绪色"的单次绽放光晕（池上限 3，onAnimationEnd 即卸）→ 连发时旧束未散完，新束叠加接管，不闪烁
   · 距上次事件 >600ms 判为"第一反应" → bump beatKey 触发眼睛专属节拍；
     <600ms 的连发（瞬时+行内转折）只平滑过渡 + 光晕叠加，不重复节拍
   · mood 与 spotlight 在同一事件里双触发 → 40ms 内去重，避免双光晕 */
let _glowCounter = 0;
function useMoodPresence(mood, spotlightKey){
  const [glows, setGlows] = useState([]);
  const [beatKey, setBeatKey] = useState(0);
  const lastFireRef = useRef(0);
  const prevMoodRef = useRef(mood);
  const prevSpotRef = useRef(spotlightKey);

  const fire = useCallback((m)=>{
    const now = performance.now();
    const gap = now - lastFireRef.current;
    if(gap < 40) return;            // 同一事件 mood+spotlight 双触发去重
    lastFireRef.current = now;
    const id = ++_glowCounter;
    setGlows(g => [...g.slice(-2), {id, c: emotionHex(m)}]);
    if(gap > 600) setBeatKey(k => k + 1);   // 仅"第一反应"起节拍
  },[]);

  useEffect(()=>{
    if(prevMoodRef.current!==null && mood!==prevMoodRef.current) fire(mood);
    prevMoodRef.current = mood;
  },[mood]);
  useEffect(()=>{
    if(spotlightKey>0 && spotlightKey!==prevSpotRef.current) fire(mood);
    prevSpotRef.current = spotlightKey;
  },[spotlightKey]);

  const glowEls = glows.map(g=>(
    <div className="mood-glow" key={g.id} style={{'--glow-c':g.c}}
      onAnimationEnd={()=>setGlows(gg=>gg.filter(x=>x.id!==g.id))}/>
  ));
  return {glowEls, beatKey};
}

function Heartbeat({state, mood}){
  const [now,setNow]=useState(()=>new Date());
  useEffect(()=>{ const t=setInterval(()=>setNow(new Date()),60000); return()=>clearInterval(t); },[]);
  const hour=now.getHours();
  const isNight = hour>=23 || hour<5;
  const isIdle = state==='等待输入';
  const base = MOOD_MAP[state] || MOOD_MAP['等待输入'];
  const m = (isIdle && isNight) ? ASLEEP : base;

  // mood visibility：只跟随当前状态，不看时间（无过期/衰减）
  const moodHidden = !mood || m.mood==='error' || m.mood==='asleep' || m.mood==='drifting';

  return(
    <div className="hb" data-mood={m.mood} data-emotion={mood||''}>
      <div className="hb-mood">
        <span className="hb-dot"/>
        <span className="hb-label">{m.zh}</span>
        <span className="hb-en">{m.en}</span>
        {!moodHidden && <>
          <span className="hb-mood-sep">·</span>
          <span key={mood} className="hb-mood-label">{mood}</span>
        </>}
      </div>
    </div>
  );
}

/* ── Status resolver (shared with Heartbeat) ── */
function resolveStatus(hbState, idleMs=0){
  const h=new Date().getHours();
  const isNight = h>=23 || h<5;
  const isIdle = hbState==='等待输入';
  const base = MOOD_MAP[hbState] || MOOD_MAP['等待输入'];
  if(isIdle && isNight) return ASLEEP;
  if(isIdle && idleMs > 90000) return DRIFTING;
  return base;
}
// 6 status × 有/无 mood × 有/无 reply 的展示契约：
const STATUS_HAS_MOOD  = {idle:true, thinking:true, tooling:true, writing:true, error:false, asleep:false, drifting:false};
const STATUS_HAS_REPLY = {idle:false,thinking:true, tooling:true, writing:true, error:false, asleep:false, drifting:false};

/* ── Lookback modal — 回顾浮层（重要经历 + 承诺，无时间线） ── */
function LookBackModal({events, commitments, userName, onClose}){
  useEffect(()=>{
    const h = (e)=>{ if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown', h);
    return ()=>window.removeEventListener('keydown', h);
  },[onClose]);
  const eventArr = Object.entries(events||{});
  const commitArr = Object.entries(commitments||{});
  return(
    <div className="lb-backdrop" onClick={onClose}>
      <div className="lb-modal" onClick={e=>e.stopPropagation()}>
        <div className="lb-head">
          <div>
            <div className="lb-head-tt">Look back · 回顾</div>
            <div className="lb-head-t">你与我之间</div>
          </div>
          <button className="lb-close" onClick={onClose} aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div className="lb-body">
          <div>
            <div className="lb-col-h">
              <span>重要经历 · significant events</span>
              <span className="ct">{eventArr.length}</span>
            </div>
            {eventArr.length===0
              ? <div className="lb-empty">还没有共同记下的事。</div>
              : eventArr.map(([uuid,text])=>(
                  <div key={uuid} className="lb-event">{text}</div>
                ))
            }
          </div>
          <div>
            <div className="lb-col-h">
              <span>承诺 · commitments</span>
              <span className="ct">{commitArr.length}</span>
            </div>
            {commitArr.length===0
              ? <div className="lb-empty">还没立下约定。</div>
              : commitArr.map(([uuid,text])=>{
                  const p = parseCommitment(text);
                  const arrow = p.dir==='ai' ? '→' : p.dir==='user' ? '←' : '↔';
                  const meta  = p.dir==='ai' ? `我（AI）→ ${p.who||userName||'对方'}`
                              : p.dir==='user' ? `${p.who||userName||'对方'} → 我`
                              : '我们 ↔ 一起';
                  return(
                    <div key={uuid} className="lb-commit">
                      <span className={`commit-arrow ${p.dir}`}>{arrow}</span>
                      <div className="commit-body">
                        <div className="commit-meta">{meta}</div>
                        <div>{p.body}</div>
                      </div>
                    </div>
                  );
                })
            }
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── MemoryAnchors（v0.145 · 三层衰减摘要） ───────────────────────────── */
function MemoryAnchors({data}){
  const near = data?.near || [];
  const mid  = data?.mid  || [];
  const far  = data?.far;
  const total = near.length + mid.length + (far?.count||0);
  const [nearExpanded,setNearExpanded] = useState(false);
  const [midOpen,setMidOpen]           = useState(false);
  // empty state
  if(total===0){
    return(
      <div className="sp-section">
        <div className="sp-section-h"><span>记忆锚点</span></div>
        <div className="anchor-empty">这是我们的第一次对话。</div>
      </div>
    );
  }
  const nearVisible = nearExpanded ? near : near.slice(0,2);
  const nearHidden  = near.length - nearVisible.length;
  return(
    <div className="sp-section">
      <div className="sp-section-h">
        <span>记忆锚点</span>
        <span className="count">{total}</span>
      </div>

      {near.length>0 && (
        <div className="anchor-tier">
          <div className="anchor-tier-h">
            <span>近记忆 · recent</span>
            <span className="anchor-tier-count">{near.length}</span>
          </div>
          {nearVisible.map(a=>(
            <div key={a.id} className="sp-card anchor-near-card">
              <div className="anchor-title">{a.title}</div>
              <div className="anchor-body">{a.body}</div>
              <div className="anchor-meta">
                <span>{a.timeLabel}</span>
                {a.mood && <>
                  <span>·</span>
                  <span className="anchor-meta-mood">{a.mood}</span>
                </>}
              </div>
            </div>
          ))}
          {nearHidden>0 && (
            <button className="anchor-near-toggle" onClick={()=>setNearExpanded(true)}>
              展开剩余 {nearHidden} 条
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          )}
          {nearExpanded && near.length>2 && (
            <button className="anchor-near-toggle" onClick={()=>setNearExpanded(false)}>
              收起
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
          )}
        </div>
      )}

      {mid.length>0 && (
        <div className="anchor-tier">
          <div className={`anchor-tier-h clickable${midOpen?' open':''}`} onClick={()=>setMidOpen(o=>!o)}>
            <span className="anchor-chev">

/* Input */
function InputBox({placeholder,onSend,big,onTyping,focusSignal=0}){
  const [val,setVal]=useState('');
  const [foc,setFoc]=useState(false);
  const [menuOpen,setMenuOpen]=useState(false);
  const [thinkSelected,setThinkSelected]=useState(false);
  const ref=useRef(null);
  const menuRef=useRef(null);
  const typingTimerRef=useRef(null);
  useEffect(()=>{ if(big&&ref.current) ref.current.focus(); },[big]);
  // 回复结束后自动聚焦输入框（focusSignal 上升沿驱动），省去手动点击
  const prevFocusRef=useRef(focusSignal);
  useEffect(()=>{
    if(focusSignal>0 && focusSignal!==prevFocusRef.current && ref.current){
      ref.current.focus();
    }
    prevFocusRef.current=focusSignal;
  },[focusSignal]);
  // close menu on outside click
  useEffect(()=>{
    if(!menuOpen) return;
    function handler(e){
      if(menuRef.current&&!menuRef.current.contains(e.target)) setMenuOpen(false);
    }
    document.addEventListener('mousedown',handler);
    return()=>document.removeEventListener('mousedown',handler);
  },[menuOpen]);

  function send(){ const v=val.trim(); if(!v) return; onSend(v); setVal(''); setThinkSelected(false); }
  const active=val.trim().length>0;

  return(
    <div style={{
      background:'var(--surface)',
      border:`1px solid ${foc?'var(--t1)':'var(--border)'}`,
      borderRadius:16,
      boxShadow:foc?'none':'var(--shadow)',
      position:'relative',
    }}>
      <textarea ref={ref} value={val}
        onChange={e=>{
          setVal(e.target.value);
          if(onTyping){
            onTyping(true);
            clearTimeout(typingTimerRef.current);
            typingTimerRef.current=setTimeout(()=>onTyping(false),1200);
          }
        }}
        onFocus={()=>setFoc(true)}
        onBlur={()=>{
          setFoc(false);
          if(onTyping){ clearTimeout(typingTimerRef.current); onTyping(false); }
        }}
        onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }}
        placeholder={placeholder}
        rows={1}
        style={{
          width:'100%',background:'transparent',border:'none',outline:'none',
          resize:'none',padding:'14px 18px 6px',
          fontSize:15,color:'var(--t1)',fontFamily:'inherit',
          lineHeight:1.7,maxHeight:180,overflow:'auto',
          letterSpacing:'-.005em',display:'block',
        }}
      />
      {/* Bottom bar */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px 10px'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,position:'relative'}} ref={menuRef}>
          {/* + button */}
          <button
            onClick={()=>setMenuOpen(o=>!o)}
            style={{
              background:'transparent',border:'none',cursor:'pointer',
              color:'var(--t2)',fontSize:20,lineHeight:1,padding:'0 4px',
              display:'flex',alignItems:'center',justifyContent:'center',
              fontWeight:300,
            }}
            onMouseEnter={e=>e.currentTarget.style.color='var(--t1)'}
            onMouseLeave={e=>e.currentTarget.style.color='var(--t2)'}
          >+</button>

          {/* Dropdown menu */}
          {menuOpen&&(
            <div style={{
              position:'absolute',bottom:'calc(100% + 8px)',left:0,
              background:'var(--surface)',border:'1px solid var(--border)',
              borderRadius:10,boxShadow:'var(--shadow-lg)',
              padding:'4px',zIndex:200,minWidth:130,
              animation:'up .12s ease both',
            }}>
              <button
                onClick={()=>{setThinkSelected(true);setMenuOpen(false);}}
                style={{
                  display:'flex',alignItems:'center',gap:8,
                  width:'100%',background:'transparent',border:'none',
                  cursor:'pointer',padding:'8px 10px',borderRadius:7,
                  fontSize:13,color:'var(--t1)',fontFamily:'inherit',
                  textAlign:'left',
                }}
                onMouseEnter={e=>e.currentTarget.style.background='var(--surf-hov)'}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style={{flexShrink:0,color:'var(--t2)'}}>
                  <path d="M12 2L13.8 10.2L22 12L13.8 13.8L12 22L10.2 13.8L2 12L10.2 10.2Z"/>
                </svg>
                思考一下
              </button>
            </div>
          )}

          {/* Think chip */}
          {thinkSelected&&(
            <div style={{
              display:'flex',alignItems:'center',gap:5,
              background:'var(--accent-s)',border:'1px solid var(--accent-r)',
              borderRadius:100,padding:'3px 10px 3px 7px',
              fontSize:12,color:'var(--accent)',cursor:'pointer',
              animation:'up .12s ease both',
            }}
            onClick={()=>setThinkSelected(false)}
            title="点击取消"
            >
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style={{flexShrink:0}}>
                <path d="M12 2L13.8 10.2L22 12L13.8 13.8L12 22L10.2 13.8L2 12L10.2 10.2Z"/>
              </svg>
              思考
            </div>
          )}
        </div>

        {/* Send button */}
        <button onClick={send} disabled={!active} style={{
          width:30,height:30,borderRadius:'50%',

      </div>
    </div>
  );
}

/* Home */
function timeGreet(){
  const h=new Date().getHours();
  if(h<5)  return {tag:'凌晨',  line:'还醒着？我陪你。'};
  if(h<9)  return {tag:'清晨',  line:'今天打算干点什么？'};
  if(h<12) return {tag:'上午',  line:'早上的脑子最清楚，开始吧。'};
  if(h<14) return {tag:'午后',  line:'吃过了吗？吃过我们就继续。'};
  if(h<18) return {tag:'下午',  line:'下午容易走神，需要我提醒你聚焦吗？'};
  if(h<22) return {tag:'傍晚',  line:'今天怎么样？想聊点什么？'};
  return         {tag:'深夜',  line:'夜深了。别熬太晚，我也是。'};
}
